<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Redaktə - Bizim Riyaziyyat</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo"><span>BR</span> Bizim Riyaziyyat</a>
            <div class="navbar-menu">
                <a href="index.html">Ana Səhifə</a>
                <a href="dashboard.html">Kabinet</a>
            </div>
            <div class="navbar-actions">
                <button onclick="logout()" class="btn btn-sm" style="background:#fee2e2;color:#dc2626;">
                    <i class="fas fa-sign-out-alt"></i> Çıxış
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container" style="padding:40px 0;max-width:600px;">
    <div class="card">
        <h2 style="margin-bottom:25px;"><i class="fas fa-user-edit"></i> Profili Redaktə Et</h2>
        
        <div id="alertBox"></div>
        
        <!-- Profil Şəkli -->
        <div style="text-align:center;margin-bottom:30px;">
            <div id="profilePicturePreview" style="width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:60px;color:white;overflow:hidden;">
                👤
            </div>
            <button onclick="uploadProfilePicture()" class="btn btn-secondary btn-sm">
                <i class="fas fa-camera"></i> Şəkil Yüklə
            </button>
            <p style="font-size:12px;color:var(--gray);margin-top:8px;">Maksimum 100KB, avtomatik kiçildilir</p>
        </div>
        
        <form id="profileForm">
            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" id="email" disabled style="background:#f1f5f9;">
                <small style="color:var(--gray);">Email dəyişdirilə bilməz</small>
            </div>
            
            <div class="form-group">
                <label>Telefon (istəyə bağlı)</label>
                <input type="tel" class="form-control" id="phone" placeholder="+994 50 123 45 67">
            </div>
            
            <div class="form-group">
                <label>Bio (istəyə bağlı)</label>
                <textarea class="form-control" id="bio" rows="3" placeholder="Özünüz haqqında qısa məlumat"></textarea>
            </div>
            
            <hr style="margin:25px 0;">
            
            <h3 style="font-size:18px;margin-bottom:15px;">Şifrəni Dəyiş</h3>
            
            <div class="form-group">
                <label>Köhnə Şifrə</label>
                <input type="password" class="form-control" id="oldPassword">
            </div>
            
            <div class="form-group">
                <label>Yeni Şifrə</label>
                <input type="password" class="form-control" id="newPassword" minlength="6">
            </div>
            
            <div class="form-group">
                <label>Yeni Şifrəni Təsdiqlə</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="6">
            </div>
            
            <div style="display:flex;gap:15px;margin-top:30px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">
                    <i class="fas fa-save"></i> Yadda Saxla
                </button>
                <a href="dashboard.html" class="btn btn-secondary" style="flex:1;text-align:center;">
                    <i class="fas fa-times"></i> Ləğv Et
                </a>
            </div>
        </form>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/upstash.js"></script>
<script src="js/storage-wrapper.js"></script>
<script src="js/auth.js"></script>
<script src="js/image-upload.js"></script>
<script>
// Giriş yoxla
if (!isLoggedIn()) {
    window.location.href = 'login.html';
}

const user = getCurrentUser();
let newProfilePicture = null;

// Formu doldur
document.getElementById('name').value = user.name || '';
document.getElementById('email').value = user.email || '';
document.getElementById('phone').value = user.phone || '';
document.getElementById('bio').value = user.bio || '';

// Profil şəklini göstər
if (user.profilePicture) {
    document.getElementById('profilePicturePreview').innerHTML = `
        <img src="${user.profilePicture}" style="width:100%;height:100%;object-fit:cover;">
    `;
}

// Şəkil yüklə
async function uploadProfilePicture() {
    try {
        const base64 = await ImageUploader.selectAndCompress();
        newProfilePicture = base64;
        document.getElementById('profilePicturePreview').innerHTML = `
            <img src="${base64}" style="width:100%;height:100%;object-fit:cover;">
        `;
        showAlert('success', 'Şəkil yükləndi! Yadda saxlamağı unutmayın.');
    } catch (error) {
        showAlert('danger', error);
    }
}

// Formu submit et
document.getElementById('profileForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const bio = document.getElementById('bio').value.trim();
    const oldPassword = document.getElementById('oldPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    // Şifrə dəyişikliyi yoxla
    if (oldPassword || newPassword || confirmPassword) {
        if (!oldPassword) {
            showAlert('danger', 'Köhnə şifrəni daxil edin');
            return;
        }
        if (newPassword !== confirmPassword) {
            showAlert('danger', 'Yeni şifrələr uyğun gəlmir');
            return;
        }
        if (newPassword.length < 6) {
            showAlert('danger', 'Yeni şifrə minimum 6 simvol olmalıdır');
            return;
        }
        
        // Köhnə şifrəni yoxla
        const allUsers = Storage.get('allUsers') || [];
        const userWithPassword = allUsers.find(u => u.email === user.email);
        if (!userWithPassword || userWithPassword.password !== oldPassword) {
            showAlert('danger', 'Köhnə şifrə yanlışdır');
            return;
        }
        
        // Şifrəni yenilə
        userWithPassword.password = newPassword;
        Storage.set('allUsers', allUsers);
    }
    
    // Profil məlumatlarını yenilə
    const updates = {
        name,
        phone,
        bio
    };
    
    if (newProfilePicture) {
        updates.profilePicture = newProfilePicture;
    }
    
    updateUser(updates);
    
    // allUsers-də də yenilə
    const allUsers = Storage.get('allUsers') || [];
    const userIndex = allUsers.findIndex(u => u.email === user.email);
    if (userIndex !== -1) {
        allUsers[userIndex] = { ...allUsers[userIndex], ...updates };
        Storage.set('allUsers', allUsers);
    }
    
    showAlert('success', 'Profil uğurla yeniləndi!');
    
    setTimeout(() => {
        window.location.href = 'dashboard.html';
    }, 1500);
});

function showAlert(type, message) {
    document.getElementById('alertBox').innerHTML = `
        <div class="alert alert-${type}">
            <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}
        </div>
    `;
}
</script>
</body>
</html>
