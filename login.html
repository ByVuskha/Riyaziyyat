<!DOCTYPE html>
<html lang="az" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — Bizim Riyaziyyat</title>
    <meta name="description" content="Bizim Riyaziyyat hesabınıza daxil olun.">
    <meta name="keywords"    content="giriş, login, riyaziyyat">
    <meta name="author"      content="Bizim Riyaziyyat">
    <meta name="robots"      content="index, follow">
    <meta property="og:type"        content="website">
    <meta property="og:url"         content="https://bizimriyaziyyat.vercel.app/login.html">
    <meta property="og:title"       content="Giriş — Bizim Riyaziyyat">
    <meta property="og:description" content="Bizim Riyaziyyat hesabınıza daxil olun.">
    <meta property="og:image"       content="https://bizimriyaziyyat.vercel.app/og-image.png">
    <meta property="og:locale"      content="az_AZ">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Giriş — Bizim Riyaziyyat">
    <meta name="twitter:description" content="Bizim Riyaziyyat hesabınıza daxil olun.">
    <meta name="twitter:image"       content="https://bizimriyaziyyat.vercel.app/og-image.png">
    <link rel="canonical" href="https://bizimriyaziyyat.vercel.app/login.html">
    
    
    
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%); min-height: 100vh; }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card {
            background: white; border-radius: 20px; padding: 44px 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        [data-theme=dark] .auth-card { background: #1e293b; color: #f1f5f9; }
        [data-theme=dark] .auth-card .form-control { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        [data-theme=dark] .auth-card .auth-subtitle,
        [data-theme=dark] .auth-card .auth-footer { color: #94a3b8; }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo a { font-size: 24px; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .auth-logo span { background: var(--primary); color: white; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
        .auth-title    { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-subtitle { color: var(--gray); font-size: 14px; margin-bottom: 26px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 15px; }
        .input-icon .form-control { padding-left: 42px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray); }
        .auth-footer a { color: var(--primary); font-weight: 600; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .alert-error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
        @media(max-width:480px){ .auth-card { padding: 32px 24px; } }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html"><span>BR</span> Bizim Riyaziyyat</a>
        </div>
        <h1 class="auth-title">Xoş gəldiniz!</h1>
        <p class="auth-subtitle">Hesabınıza daxil olun</p>

        <div id="alertBox"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" id="email"
                           placeholder="email@example.com" autocomplete="email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Şifrə</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="password"
                           placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Daxil Ol
            </button>
        </form>

        <div class="auth-footer">
            Hesabınız yoxdur? <a href="register.html">Qeydiyyat</a>
        </div>
    </div>
</div>

<script src="js/notifications.js"></script>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
    // Redirect if already logged in
    await redirectIfLoggedIn('dashboard.html');

    const form    = document.getElementById('loginForm');
    const btn     = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, type = 'error') {
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}</div>`;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showAlert('Email və şifrə daxil edin');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Yüklənir...';
        alertBox.innerHTML = '';

        try {
            const { user } = await API.auth.login(email, password);
            showAlert('Uğurla daxil oldunuz!', 'success');

            // Read redirect param if present
            const params   = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'dashboard.html';
            setTimeout(() => window.location.href = redirect, 700);
        } catch (err) {
            const msg = err.data?.error || err.message || 'Giriş mümkün olmadı';
            if (err.status === 403) {
                showAlert('Hesabınız bloklanıb. Dəstək xidməti ilə əlaqə saxlayın.', 'error');
            } else {
                showAlert(msg);
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Daxil Ol';
        }
    });
})();
</script>
</body>
</html>
