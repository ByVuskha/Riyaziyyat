<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Bizim Riyaziyyat</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo a {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .auth-logo span {
            background: var(--primary);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .auth-subtitle { color: var(--gray); font-size: 14px; margin-bottom: 30px; }
        .input-icon { position: relative; }
        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }
        .input-icon .form-control { padding-left: 42px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray); }
        .auth-footer a { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html"><span>BR</span> Bizim Riyaziyyat</a>
        </div>
        <h2 class="auth-title">Xoş gəldiniz!</h2>
        <p class="auth-subtitle">Hesabınıza daxil olun</p>

        <div id="alertBox"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Şifrə</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Daxil Ol
            </button>
        </form>

        <div class="auth-footer">
            Hesabınız yoxdur? <a href="register.html">Qeydiyyat</a>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    // Redirect if already logged in
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Yüklənir...';

        setTimeout(() => {
            const result = login(email, password);
            if (result.success) {
                alertBox.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> Uğurla daxil oldunuz!</div>';
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } else {
                alertBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${result.message}</div>`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Daxil Ol';
            }
        }, 600);
    });
</script>
<script src="js/upstash.js"></script>
<script src="js/storage-wrapper.js"></script>
</body>
</html>
