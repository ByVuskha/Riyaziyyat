<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifrəni Yenilə — Bizim Riyaziyyat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, var(--dark), var(--primary)); min-height: 100vh; }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 440px; padding: 40px; border-radius: 20px; background: white; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        [data-theme=dark] .auth-card { background: #1e293b; color: #f1f5f9; }
        .auth-logo { margin-bottom: 24px; text-align: center; }
        .auth-logo a { display: inline-flex; align-items: center; gap: 10px; color: var(--primary); font-size: 22px; font-weight: 800; }
        .auth-logo span { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center; border-radius: 9px; background: var(--primary); color: white; }
        .auth-title { margin-bottom: 6px; font-size: 22px; }
        .auth-subtitle { margin-bottom: 22px; color: var(--gray); font-size: 14px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--gray); }
        .input-icon .form-control { padding-left: 42px; }
        .auth-footer { margin-top: 18px; text-align: center; color: var(--gray); font-size: 14px; }
        .auth-footer a { color: var(--primary); font-weight: 600; }
        .alert { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 16px; padding: 12px 14px; border: 1px solid; border-radius: 9px; font-size: 14px; }
        .alert-error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
        .alert-success { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
        @media (max-width: 480px) { .auth-card { padding: 30px 22px; } }
    </style>
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="resetTitle">
        <div class="auth-logo"><a href="index.html"><span>BR</span> Bizim Riyaziyyat</a></div>
        <h1 class="auth-title" id="resetTitle">Yeni şifrə yarat</h1>
        <p class="auth-subtitle">Hesabınız üçün yeni şifrə seçin.</p>
        <div id="alertBox" aria-live="polite"></div>
        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="newPassword">Yeni şifrə</label>
                <div class="input-icon">
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <input class="form-control" id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Minimum 6 simvol" required>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Şifrəni təkrar daxil edin</label>
                <div class="input-icon">
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <input class="form-control" id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Şifrəni təkrarlayın" required>
                </div>
            </div>
            <button class="btn btn-primary btn-block" id="resetSubmit" type="submit">
                <i class="fas fa-key" aria-hidden="true"></i> Şifrəni yenilə
            </button>
        </form>
        <div class="auth-footer"><a href="login.html">Giriş səhifəsinə qayıt</a></div>
    </section>
</main>
<canvas id="mathCanvas"></canvas>
<script src="js/confetti.js"></script>
<script src="js/math-bg.js"></script>
<script src="js/animations.js"></script>
<script src="js/notifications.js"></script>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script>
(() => {
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const submit = document.getElementById('resetSubmit');

    function showAlert(message, type) {
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        const icon = document.createElement('i');
        icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
        icon.setAttribute('aria-hidden', 'true');
        const text = document.createElement('span');
        text.textContent = message;
        alert.append(icon, text);
        alertBox.replaceChildren(alert);
    }

    if (!/^[a-f0-9]{64}$/i.test(token)) {
        form.hidden = true;
        showAlert('Bərpa linki yanlışdır və ya vaxtı bitib. Yeni link istəyin.', 'error');
        return;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirmation = document.getElementById('confirmPassword').value;
        if (password.length < 6) return showAlert('Şifrə minimum 6 simvol olmalıdır.', 'error');
        if (password !== confirmation) return showAlert('Şifrələr uyğun gəlmir.', 'error');

        submit.disabled = true;
        submit.innerHTML = '<i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Yenilənir...';
        try {
            const result = await API.auth.resetPassword(token, password);
            form.hidden = true;
            showAlert(result.message || 'Şifrəniz yeniləndi.', 'success');
        } catch (error) {
            showAlert(error.data?.error || 'Link etibarsızdır və ya vaxtı bitib. Yeni bərpa linki istəyin.', 'error');
            submit.disabled = false;
            submit.innerHTML = '<i class="fas fa-key" aria-hidden="true"></i> Şifrəni yenilə';
        }
    });
})();
</script>
</body>
</html>
