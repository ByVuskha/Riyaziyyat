<script>
function formatNewsDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function getNewsReadKey() {
    let userId = 'guest';
    try {
        const current = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (current.user?.id) userId = String(current.user.id);
    } catch {}
    return `readNews:${userId}`;
}

function getReadNewsIds() {
    try {
        const saved = JSON.parse(localStorage.getItem(getNewsReadKey()) || '[]');
        return new Set(Array.isArray(saved) ? saved.map(String) : []);
    } catch {
        return new Set();
    }
}

async function setNewsRead(button) {
    if (button.disabled || button.dataset.reading === 'true') return;
    const readKey = button.dataset.newsId || '';
    const id = decodeURIComponent(readKey);
    button.dataset.reading = 'true';
    button.classList.add('is-read');
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-check" aria-hidden="true"></i> Oxundu';

    const readIds = getReadNewsIds();
    readIds.add(readKey);
    try {
        localStorage.setItem(getNewsReadKey(), JSON.stringify([...readIds]));
    } catch (error) {
        console.warn('Oxunmuş xəbərləri yadda saxlamaq mümkün olmadı:', error);
    }

    try {
        await API.news.view(id);
        await new Promise(resolve => window.setTimeout(resolve, 20500));
        const result = await API.news.completeRead(id);
        if (result.earnedPoints > 0) {
            showNotification(`Xəbər oxundu: +${result.earnedPoints} xal`, 'success');
        }
        window.dispatchEvent(new CustomEvent('points:updated'));
    } catch (error) {
        if (error.status !== 401) {
            readIds.delete(readKey);
            try {
                localStorage.setItem(getNewsReadKey(), JSON.stringify([...readIds]));
            } catch (storageError) {
                console.warn('Oxunmuş xəbərləri yeniləmək mümkün olmadı:', storageError);
            }
            button.classList.remove('is-read');
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-book-open" aria-hidden="true"></i> Xəbəri oxu';
            showNotification(error.message || 'Xəbərin oxunmasını təsdiqləmək mümkün olmadı. Yenidən cəhd edin.', 'error');
        }
    } finally {
        delete button.dataset.reading;
    }
}

async function loadNews() {
    const list    = document.getElementById('newsList');
    const sidebar = document.getElementById('sidebarNews');
    const statUsers = document.getElementById('statUsers');
    const statNews = document.getElementById('statNews');
    const statVideos = document.getElementById('statVideos');
    const statThisMonth = document.getElementById('statThisMonth');
    if (list) list.innerHTML = '<div style="padding:60px;text-align:center;color:#94a3b8;"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>';
    try {
        const [stats, newsRes] = await Promise.all([
            API.stats.get(),
            API.news ? API.news.list({ limit: 50 }) : { data: [] }
        ]);
        const news = Array.isArray(newsRes?.data) ? newsRes.data : [];

        if (statUsers) statUsers.textContent = Number(stats.users || 0).toLocaleString('az-AZ');
        if (statNews) statNews.textContent = Number(stats.news ?? news.length).toLocaleString('az-AZ');
        if (statVideos) statVideos.textContent = Number(stats.videos || 0).toLocaleString('az-AZ');
        if (statThisMonth) {
            const current = new Date();
            const thisMonthCount = news.filter(item => {
                const date = item.createdAt || item.date;
                if (!date) return false;
                const created = new Date(date);
                if (Number.isNaN(created.getTime())) return false;
                return (current - created) <= (30 * 24 * 60 * 60 * 1000);
            }).length;
            statThisMonth.textContent = `${Number(thisMonthCount || 0).toLocaleString('az-AZ')}`;
        }

        const requestedId = new URLSearchParams(window.location.search).get('id');
        const visibleNews = requestedId ? news.filter(item => String(item.id) === requestedId) : news;
        const readNewsIds = getReadNewsIds();
        if (!visibleNews.length && list) { list.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px;">Xəbər tapılmadı</p>'; return; }
        if (list) list.innerHTML = visibleNews.map(n => `
            <div class="news-card">
                ${n.imageUrl ? `<img src="${n.imageUrl}" alt="${n.title}" class="news-img" style="background:#eef2ff;object-fit:cover;">` : `<div class="news-img" style="background:#eef2ff;">${n.emoji||'📰'}</div>`}
                <div class="news-body">
                    <h3>${n.title}</h3>
                    <p>${n.text||''}</p>
                    <div class="news-meta">
                        <span><i class="fas fa-calendar"></i> ${formatNewsDate(n.createdAt||n.date)}</span>
                        <span><i class="fas fa-user"></i> ${n.author||'Admin'}</span>
                        <span><i class="fas fa-eye"></i> ${n.views||0} baxış</span>
                    </div>
                    <button type="button" class="news-read-button${readNewsIds.has(String(n.id)) ? ' is-read' : ''}"
                            data-news-read data-news-id="${encodeURIComponent(String(n.id))}"
                            ${readNewsIds.has(String(n.id)) ? 'disabled' : ''}>
                        <i class="fas ${readNewsIds.has(String(n.id)) ? 'fa-check' : 'fa-book-open'}" aria-hidden="true"></i>
                        ${readNewsIds.has(String(n.id)) ? 'Oxundu' : 'Xəbəri oxu'}
                    </button>
                </div>
            </div>`).join('');
        list.querySelectorAll('[data-news-read]').forEach(button => {
            button.addEventListener('click', () => setNewsRead(button));
        });
        if (sidebar) sidebar.innerHTML = news.slice(0,4).map(n => `
            <div class="sidebar-news">
                <div class="sidebar-news-emoji">${n.emoji||'📰'}</div>
                <div><h5>${n.title}</h5><span>${formatNewsDate(n.createdAt||n.date)}</span></div>
            </div>`).join('');
    } catch(e) {
        if (list) list.innerHTML = `<p style="text-align:center;color:#ef4444;padding:40px;">${e.message}</p>`;
        if (statUsers) statUsers.textContent = '0';
        if (statNews) statNews.textContent = '0';
        if (statVideos) statVideos.textContent = '0';
        if (statThisMonth) statThisMonth.textContent = '0';
    }
}
document.addEventListener('DOMContentLoaded', () => { loadNews(); updateNavbar(); });
