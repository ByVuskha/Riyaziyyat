<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat - Bizim Riyaziyyat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo a {
            font-size: 26px; font-weight: 800; color: var(--primary);
            display: inline-flex; align-items: center; gap: 10px;
        }
        .auth-logo span {
            background: var(--primary); color: white;
            width: 42px; height: 42px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .auth-subtitle { color: var(--gray); font-size: 14px; margin-bottom: 30px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); }
        .input-icon .form-control { padding-left: 42px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray); }
        .auth-footer a { color: var(--primary); font-weight: 600; }
        .password-strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; background: var(--border); }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html"><span>BR</span> Bizim Riyaziyyat</a>
        </div>
        <h2 class="auth-title">Hesab Yarat</h2>
        <p class="auth-subtitle">Pulsuz qeydiyyatdan keç</p>

        <div id="alertBox"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Ad Soyad</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control" id="name" placeholder="Adınız Soyadınız" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>İstifadəçi Tipi</label>
                <div style="display:flex;gap:15px;">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;padding:12px;border:2px solid var(--border);border-radius:8px;transition:all 0.2s;">
                        <input type="radio" name="userType" value="student" checked onchange="updateUserTypeStyle(this)">
                        <i class="fas fa-user-graduate" style="color:var(--primary);"></i> Şagird
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;padding:12px;border:2px solid var(--border);border-radius:8px;transition:all 0.2s;">
                        <input type="radio" name="userType" value="teacher" onchange="updateUserTypeStyle(this)">
                        <i class="fas fa-chalkboard-teacher" style="color:var(--success);"></i> Müəllim
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label>Şifrə</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="password" placeholder="Minimum 6 simvol" required minlength="6">
                </div>
                <div class="password-strength" id="strengthBar"></div>
            </div>
            <div class="form-group">
                <label>Şifrəni Təsdiqlə</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Şifrəni təkrar daxil et" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i class="fas fa-user-plus"></i> Qeydiyyat
            </button>
        </form>

        <div class="auth-footer">
            Artıq hesabınız var? <a href="login.html">Daxil Ol</a>
        </div>
    </div>
</div>

<script src="js/storage-wrapper.js"></script>
<script src="js/auth.js"></script>
<script src="js/email-service.js"></script>
<script>
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    // Update user type style
    function updateUserTypeStyle(radio) {
        document.querySelectorAll('input[name="userType"]').forEach(r => {
            const label = r.parentElement;
            if (r.checked) {
                label.style.borderColor = 'var(--primary)';
                label.style.background = '#eef2ff';
            } else {
                label.style.borderColor = 'var(--border)';
                label.style.background = 'white';
            }
        });
    }

    // Password strength indicator
    document.getElementById('password').addEventListener('input', function() {
        const bar = document.getElementById('strengthBar');
        const len = this.value.length;
        if (len === 0) { bar.style.width = '0'; bar.style.background = 'var(--border)'; }
        else if (len < 6) { bar.style.width = '33%'; bar.style.background = 'var(--danger)'; }
        else if (len < 10) { bar.style.width = '66%'; bar.style.background = 'var(--warning)'; }
        else { bar.style.width = '100%'; bar.style.background = 'var(--success)'; }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const userType = document.querySelector('input[name="userType"]:checked').value;
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        if (password !== confirm) {
            alertBox.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Şifrələr uyğun gəlmir</div>';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Email göndərilir...';

        try {
            // Generate verification code
            const verificationCode = generateVerificationCode();
            
            // Send email via EmailJS
            const emailResult = await sendVerificationEmail(email, name, verificationCode);
            
            if (emailResult.demo) {
                // Demo mode - show code in alert
                alert(`📧 Email Doğrulama (Demo Rejimi)\n\nEmailJS konfiqurasiya edilməyib.\n\n🔑 Doğrulama Kodu: ${emailResult.code}\n\n⚙️ Real email göndərmək üçün:\n1. https://www.emailjs.com saytında qeydiyyatdan keçin\n2. js/email-service.js faylında konfiqurasiya edin`);
            } else {
                // Real email sent
                alert(`📧 Email Göndərildi!\n\n${email} ünvanına doğrulama kodu göndərildi.\n\nZəhmət olmasa email qutunuzu yoxlayın.`);
            }
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Doğrulama gözlənilir...';
            
            // Ask for verification code
            const userCode = prompt('Email ünvanınıza göndərilən 6 rəqəmli doğrulama kodunu daxil edin:');
            
            if (!userCode) {
                alertBox.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Email doğrulanmadı</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Qeydiyyat';
                return;
            }

            if (userCode !== verificationCode) {
                alertBox.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Yanlış doğrulama kodu</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Qeydiyyat';
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Qeydiyyat tamamlanır...';

            // Register user
            const result = register(name, email, password, userType);
            
            if (result.success) {
                alertBox.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> ✅ Qeydiyyat uğurlu! Email doğrulandı.</div>';
                
                // Send welcome email (optional)
                if (!emailResult.demo) {
                    await sendWelcomeEmail(email, name);
                }
                
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } else {
                alertBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${result.message}</div>`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Qeydiyyat';
            }
            
        } catch (error) {
            console.error('Registration error:', error);
            alertBox.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Xəta baş verdi. Yenidən cəhd edin.</div>';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Qeydiyyat';
        }
    });

    // Initialize user type style
    updateUserTypeStyle(document.querySelector('input[name="userType"]:checked'));
</script>
<script src="js/mobile-menu.js"></script>
</body>
</html>
