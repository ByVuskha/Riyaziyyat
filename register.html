<!DOCTYPE html>
<html lang="az" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat — Bizim Riyaziyyat</title>
    <meta name="description" content="Pulsuz qeydiyyatdan keçin. Video dərslərə və sınaqlara çıxış əldə edin.">
    <meta name="keywords"    content="qeydiyyat, hesab yarat, riyaziyyat">

    <meta property="og:url"         content="https://bizimriyaziyyat.vercel.app/register.html">
    <meta property="og:title"       content="Qeydiyyat — Bizim Riyaziyyat">
    <meta property="og:description" content="Pulsuz qeydiyyatdan keçin. Video dərslərə və sınaqlara çıxış əldə edin.">
    <meta property="og:image"       content="https://bizimriyaziyyat.vercel.app/og-image.png">
    <meta property="og:locale"      content="az_AZ">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Qeydiyyat — Bizim Riyaziyyat">
    <meta name="twitter:description" content="Pulsuz qeydiyyatdan keçin. Video dərslərə və sınaqlara çıxış əldə edin.">
    <meta name="twitter:image"       content="https://bizimriyaziyyat.vercel.app/og-image.png">
    <link rel="canonical" href="https://bizimriyaziyyat.vercel.app/register.html">
    
    
    
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%); min-height: 100vh; }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card {
            background: white; border-radius: 20px; padding: 44px 40px;
            width: 100%; max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        [data-theme=dark] .auth-card { background: #1e293b; color: #f1f5f9; }
        [data-theme=dark] .form-control { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo a { font-size: 24px; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .auth-logo span { background: var(--primary); color: white; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
        .auth-title    { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-subtitle { color: var(--gray); font-size: 14px; margin-bottom: 26px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 15px; }
        .input-icon .form-control { padding-left: 42px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray); }
        .auth-footer a { color: var(--primary); font-weight: 600; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
        .alert i { margin-top: 2px; }
        .alert-content { min-width: 0; }
        .alert-error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
        .verification-note { margin: 0 0 18px; color: var(--gray); font-size: 14px; line-height: 1.6; }
        .verification-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .verification-secondary { border: 0; background: transparent; color: var(--primary); font: inherit; font-size: 14px; cursor: pointer; padding: 8px; }
        .verification-secondary:disabled { opacity: .55; cursor: wait; }

        /* User type selector */
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .type-option { border: 2px solid var(--border); border-radius: 10px; padding: 14px 12px; cursor: pointer; text-align: center; transition: all .2s; }
        .type-option:hover { border-color: var(--primary); }
        .type-option.selected { border-color: var(--primary); background: #eef2ff; }
        .type-option i { font-size: 24px; margin-bottom: 6px; display: block; }
        .type-option span { font-size: 13px; font-weight: 600; }

        /* Password strength */
        .pw-strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: all .3s; background: #e2e8f0; }
        .pw-strength.weak   { background: #ef4444; width: 33%; }
        .pw-strength.medium { background: #f59e0b; width: 66%; }
        .pw-strength.strong { background: #10b981; width: 100%; }
        @media(max-width:480px){ .auth-card { padding: 32px 24px; } }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html"><span>BR</span> Bizim Riyaziyyat</a>
        </div>
        <h1 class="auth-title">Hesab Yaradın</h1>
        <p class="auth-subtitle">Pulsuz qeydiyyatdan keçin</p>

        <div id="alertBox"></div>

        <form id="registerForm" novalidate>
            <!-- User type -->
            <div class="form-group">
                <label>Hesab növü</label>
                <div class="type-selector">
                    <div class="type-option selected" id="typeStudent" onclick="selectType('student')">
                        <i class="fas fa-user-graduate" style="color:#4f46e5;"></i>
                        <span>Şagird</span>
                    </div>
                    <div class="type-option" id="typeTeacher" onclick="selectType('teacher')">
                        <i class="fas fa-chalkboard-teacher" style="color:#10b981;"></i>
                        <span>Müəllim</span>
                    </div>
                </div>
                <input type="hidden" id="userType" value="student">
            </div>

            <div class="form-group">
                <label for="name">Ad Soyad</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control" id="name"
                           placeholder="Adınız Soyadınız" autocomplete="name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" id="email"
                           placeholder="email@example.com" autocomplete="email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Şifrə</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="password"
                           placeholder="Minimum 6 simvol" autocomplete="new-password"
                           oninput="checkStrength(this.value)" required>
                </div>
                <div class="pw-strength" id="pwStrength"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i class="fas fa-user-plus"></i> Qeydiyyat
            </button>
        </form>

        <form id="verificationForm" novalidate hidden>
            <p class="verification-note" id="verificationNote">Email ünvanınıza göndərilən 6 rəqəmli kodu daxil edin. Kod 10 dəqiqə etibarlıdır.</p>
            <div class="form-group">
                <label for="verificationCode">Email təsdiq kodu</label>
                <div class="input-icon">
                    <i class="fas fa-shield-alt"></i>
                    <input type="text" class="form-control" id="verificationCode"
                           placeholder="123456" inputmode="numeric" autocomplete="one-time-code"
                           pattern="[0-9]{6}" maxlength="6" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="verifyBtn">
                <i class="fas fa-check-circle"></i> Kodu Təsdiqlə və Qeydiyyatı Bitir
            </button>
            <div class="verification-actions">
                <button type="button" class="verification-secondary" id="resendCodeBtn">Kodu yenidən göndər</button>
                <button type="button" class="verification-secondary" id="editRegistrationBtn">Məlumatları dəyiş</button>
            </div>
        </form>

        <div class="auth-footer">
            Artıq hesabınız var? <a href="login.html">Giriş</a>
        </div>
    </div>
</div>

    <canvas id="mathCanvas"></canvas>
    <script src="js/confetti.js"></script>
    <script src="js/math-bg.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/notifications.js"></script>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await redirectIfLoggedIn('dashboard.html');

    const form     = document.getElementById('registerForm');
    const btn      = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const verificationForm = document.getElementById('verificationForm');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendCodeBtn');
    const subtitle = document.querySelector('.auth-subtitle');

    function showAlert(msg, type = 'error') {
        const icons = { error: 'fa-exclamation-circle', success: 'fa-check-circle', warning: 'fa-exclamation-triangle' };
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.setAttribute('role', type === 'error' ? 'alert' : 'status');
        const icon = document.createElement('i');
        icon.className = `fas ${icons[type] || icons.error}`;
        icon.setAttribute('aria-hidden', 'true');
        const content = document.createElement('span');
        content.className = 'alert-content';
        content.textContent = msg;
        alert.replaceChildren(icon, content);
        alertBox.replaceChildren(alert);
    }

    window.selectType = function(type) {
        document.getElementById('userType').value = type;
        document.getElementById('typeStudent').classList.toggle('selected', type === 'student');
        document.getElementById('typeTeacher').classList.toggle('selected', type === 'teacher');
    };

    window.checkStrength = function(val) {
        const bar = document.getElementById('pwStrength');
        if (!val) { bar.className = 'pw-strength'; return; }
        if (val.length < 6)  bar.className = 'pw-strength weak';
        else if (val.length < 10) bar.className = 'pw-strength medium';
        else bar.className = 'pw-strength strong';
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name     = document.getElementById('name').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const userType = document.getElementById('userType').value;

        if (!name)  { showAlert('Adınızı daxil edin'); return; }
        if (!email) { showAlert('Email daxil edin'); return; }
        if (password.length < 6) { showAlert('Şifrə minimum 6 simvol olmalıdır'); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Kod göndərilir...';
        alertBox.innerHTML = '';

        try {
            const result = await API.auth.sendRegistrationCode(name, email, password, userType);
            form.hidden = true;
            verificationForm.hidden = false;
            subtitle.textContent = 'Email ünvanınızı təsdiqləyin';
            document.getElementById('verificationNote').textContent = `${result.message || 'Təsdiq kodu email ünvanınıza göndərildi.'} Kod 10 dəqiqə etibarlıdır.`;
            document.getElementById('verificationCode').focus();
            showAlert(`Təsdiq kodu ${email} ünvanına göndərildi.`, 'success');
        } catch (err) {
            const msg = err.data?.error || err.message || 'Qeydiyyat mümkün olmadı';
            showAlert(msg);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Qeydiyyat';
        }
    });

    verificationForm.addEventListener('submit', async event => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const verificationCode = document.getElementById('verificationCode').value.trim();
        if (!/^\d{6}$/.test(verificationCode)) {
            showAlert('Emailə göndərilən 6 rəqəmli kodu daxil edin.');
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Yoxlanılır...';
        try {
            await API.auth.register(email, verificationCode);
            showAlert('Email təsdiqləndi və qeydiyyat tamamlandı!', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 700);
        } catch (err) {
            showAlert(err.data?.error || err.message || 'Kodu yoxlamaq mümkün olmadı.');
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Kodu Təsdiqlə və Qeydiyyatı Bitir';
        }
    });

    resendBtn.addEventListener('click', async () => {
        resendBtn.disabled = true;
        const previousLabel = resendBtn.textContent;
        resendBtn.textContent = 'Göndərilir...';
        try {
            const result = await API.auth.sendRegistrationCode(
                document.getElementById('name').value.trim(),
                document.getElementById('email').value.trim(),
                document.getElementById('password').value,
                document.getElementById('userType').value
            );
            document.getElementById('verificationCode').value = '';
            showAlert(result.message || 'Yeni təsdiq kodu göndərildi.', 'success');
        } catch (err) {
            showAlert(err.data?.error || err.message || 'Yeni kod göndərilmədi.', 'warning');
        } finally {
            resendBtn.disabled = false;
            resendBtn.textContent = previousLabel;
        }
    });

    document.getElementById('editRegistrationBtn').addEventListener('click', () => {
        verificationForm.hidden = true;
        form.hidden = false;
        subtitle.textContent = 'Pulsuz qeydiyyatdan keçin';
        document.getElementById('verificationCode').value = '';
        alertBox.replaceChildren();
    });
});
</script>
</body>
</html>
