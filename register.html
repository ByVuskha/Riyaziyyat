<!DOCTYPE html>
<html lang="az" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat — Bizim Riyaziyyat</title>
    <meta name="description" content="Bizim Riyaziyyat-a qeydiyyatdan keçin. Riyaziyyat dərslərini, sınaqları və materialları pulsuz əldə edin.">
    <meta property="og:title"       content="Qeydiyyat — Bizim Riyaziyyat">
    <meta property="og:description" content="Pulsuz hesab yaradın">
    <meta property="og:url"         content="https://bizimriyaziyyat.vercel.app/register.html">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%); min-height: 100vh; }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card {
            background: white; border-radius: 20px; padding: 44px 40px;
            width: 100%; max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        [data-theme=dark] .auth-card { background: #1e293b; color: #f1f5f9; }
        [data-theme=dark] .form-control { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo a { font-size: 24px; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .auth-logo span { background: var(--primary); color: white; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
        .auth-title    { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-subtitle { color: var(--gray); font-size: 14px; margin-bottom: 26px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 15px; }
        .input-icon .form-control { padding-left: 42px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray); }
        .auth-footer a { color: var(--primary); font-weight: 600; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .alert-error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }

        /* User type selector */
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .type-option { border: 2px solid var(--border); border-radius: 10px; padding: 14px 12px; cursor: pointer; text-align: center; transition: all .2s; }
        .type-option:hover { border-color: var(--primary); }
        .type-option.selected { border-color: var(--primary); background: #eef2ff; }
        .type-option i { font-size: 24px; margin-bottom: 6px; display: block; }
        .type-option span { font-size: 13px; font-weight: 600; }

        /* Password strength */
        .pw-strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: all .3s; background: #e2e8f0; }
        .pw-strength.weak   { background: #ef4444; width: 33%; }
        .pw-strength.medium { background: #f59e0b; width: 66%; }
        .pw-strength.strong { background: #10b981; width: 100%; }
        @media(max-width:480px){ .auth-card { padding: 32px 24px; } }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html"><span>BR</span> Bizim Riyaziyyat</a>
        </div>
        <h1 class="auth-title">Hesab Yaradın</h1>
        <p class="auth-subtitle">Pulsuz qeydiyyatdan keçin</p>

        <div id="alertBox"></div>

        <form id="registerForm" novalidate>
            <!-- User type -->
            <div class="form-group">
                <label>Hesab növü</label>
                <div class="type-selector">
                    <div class="type-option selected" id="typeStudent" onclick="selectType('student')">
                        <i class="fas fa-user-graduate" style="color:#4f46e5;"></i>
                        <span>Şagird</span>
                    </div>
                    <div class="type-option" id="typeTeacher" onclick="selectType('teacher')">
                        <i class="fas fa-chalkboard-teacher" style="color:#10b981;"></i>
                        <span>Müəllim</span>
                    </div>
                </div>
                <input type="hidden" id="userType" value="student">
            </div>

            <div class="form-group">
                <label for="name">Ad Soyad</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control" id="name"
                           placeholder="Adınız Soyadınız" autocomplete="name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" id="email"
                           placeholder="email@example.com" autocomplete="email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Şifrə</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" id="password"
                           placeholder="Minimum 6 simvol" autocomplete="new-password"
                           oninput="checkStrength(this.value)" required>
                </div>
                <div class="pw-strength" id="pwStrength"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i class="fas fa-user-plus"></i> Qeydiyyat
            </button>
        </form>

        <div class="auth-footer">
            Artıq hesabınız var? <a href="login.html">Giriş</a>
        </div>
    </div>
</div>

<script src="js/notifications.js"></script>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
    await redirectIfLoggedIn('dashboard.html');

    const form     = document.getElementById('registerForm');
    const btn      = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, type = 'error') {
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}</div>`;
    }

    window.selectType = function(type) {
        document.getElementById('userType').value = type;
        document.getElementById('typeStudent').classList.toggle('selected', type === 'student');
        document.getElementById('typeTeacher').classList.toggle('selected', type === 'teacher');
    };

    window.checkStrength = function(val) {
        const bar = document.getElementById('pwStrength');
        if (!val) { bar.className = 'pw-strength'; return; }
        if (val.length < 6)  bar.className = 'pw-strength weak';
        else if (val.length < 10) bar.className = 'pw-strength medium';
        else bar.className = 'pw-strength strong';
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name     = document.getElementById('name').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const userType = document.getElementById('userType').value;

        if (!name)  { showAlert('Adınızı daxil edin'); return; }
        if (!email) { showAlert('Email daxil edin'); return; }
        if (password.length < 6) { showAlert('Şifrə minimum 6 simvol olmalıdır'); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Qeydiyyat...';
        alertBox.innerHTML = '';

        try {
            await API.auth.register(name, email, password, userType);
            showAlert('Qeydiyyat uğurla tamamlandı!', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 700);
        } catch (err) {
            const msg = err.data?.error || err.message || 'Qeydiyyat mümkün olmadı';
            showAlert(msg);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Qeydiyyat';
        }
    });
})();
</script>
</body>
</html>
