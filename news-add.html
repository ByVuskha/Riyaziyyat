<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xəbər Əlavə Et - Bizim Riyaziyyat</title>`n    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo">
                <span>BR</span> Bizim Riyaziyyat
            </a>
            <div class="navbar-actions">
                <button class="hamburger-btn" aria-label="Menyu" aria-expanded="false"><i class="fas fa-bars"></i></button>
                <a href="admin.html" class="btn btn-secondary btn-sm">
                    <i class="fas fa-arrow-left"></i> Admin Panelə Qayıt
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container" style="max-width:800px;padding:40px 20px;">
    <div style="background:white;border-radius:16px;padding:35px;box-shadow:var(--shadow);">
        <h1 style="margin-bottom:10px;"><i class="fas fa-newspaper"></i> Xəbər Əlavə Et</h1>
        <p style="color:var(--gray);margin-bottom:30px;">Yeni xəbər əlavə edin və bütün istifadəçilərə göstərin</p>
        
        <div id="alertBox"></div>
        
        <form id="newsForm">
            <div class="form-group">
                <label>Xəbər Başlığı *</label>
                <input type="text" class="form-control" id="newsTitle" placeholder="Məs: Yeni 50 Video Əlavə Edildi" required>
            </div>
            
            <div class="form-row" style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;">
                <div class="form-group">
                    <label>Emoji</label>
                    <select class="form-control" id="newsEmoji">
                        <option value="🎉">🎉 Qeyd</option>
                        <option value="📢">📢 Elan</option>
                        <option value="🏆">🏆 Uğur</option>
                        <option value="💡">💡 Məlumat</option>
                        <option value="🎓">🎓 Təhsil</option>
                        <option value="📱">📱 Texnologiya</option>
                        <option value="💳">💳 Ödəniş</option>
                        <option value="🔔">🔔 Bildiriş</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Rəng</label>
                    <select class="form-control" id="newsColor">
                        <option value="#eef2ff">🔵 Mavi</option>
                        <option value="#ecfdf5">🟢 Yaşıl</option>
                        <option value="#fffbeb">🟡 Sarı</option>
                        <option value="#fef2f2">🔴 Qırmızı</option>
                        <option value="#fdf4ff">🟣 Bənövşəyi</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Xəbər Mətni *</label>
                <textarea class="form-control" id="newsText" rows="5" placeholder="Xəbərin tam mətnini daxil edin..." required></textarea>
            </div>
            
            <div class="form-group">
                <label>Müəllif</label>
                <input type="text" class="form-control" id="newsAuthor" value="Bizim Riyaziyyat Komandası">
            </div>
            
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Xəbəri Dərc Et
                </button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='admin.html'">
                    <i class="fas fa-times"></i> Ləğv Et
                </button>
            </div>
        </form>
        
        <hr style="margin:40px 0;">
        
        <h3 style="margin-bottom:20px;">Son Xəbərlər</h3>
        <div id="newsList"></div>
    </div>
</div>





<script>
document.addEventListener('DOMContentLoaded', async () => {
    const user = await API.getCurrentUser();
    if (!user || user.role !== 'admin') {
        showNotification('Bu səhifəyə giriş yalnız adminlər üçündür!', 'warning');
        setTimeout(() => window.location.href = 'index.html', 700);
        return;
    }

    document.getElementById('newsForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const newsData = {
        id: Date.now(),
        title: document.getElementById('newsTitle').value,
        text: document.getElementById('newsText').value,
        emoji: document.getElementById('newsEmoji').value,
        author: document.getElementById('newsAuthor').value,
    };
    
    try {
        await API.news.create(newsData);
    } catch (error) {
        document.getElementById('alertBox').innerHTML = `
            <div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(error.message || 'Xəbəri dərc etmək mümkün olmadı.')}</div>`;
        return;
    }
    
    document.getElementById('alertBox').innerHTML = `
        <div class="alert alert-success">
            <i class="fas fa-check-circle"></i> Xəbər uğurla əlavə edildi!
        </div>
    `;
    
    // Reset form
    document.getElementById('newsForm').reset();
    document.getElementById('newsAuthor').value = 'Bizim Riyaziyyat Komandası';
    
    // Reload news list
    loadNews();
    
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

async function loadNews() {
    const container = document.getElementById('newsList');
    container.innerHTML = '<p style="text-align:center;color:var(--gray);padding:24px;">Yüklənir...</p>';
    let news;
    try {
        ({ data: news } = await API.news.list({ limit: 5 }));
    } catch (error) {
        container.innerHTML = `<p role="alert" style="text-align:center;color:var(--danger);padding:24px;">${escapeHtml(error.message || 'Xəbərləri yükləmək mümkün olmadı.')}</p>`;
        return;
    }

    if (news.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--gray);padding:40px;">Hələ xəbər yoxdur</p>';
        return;
    }
    
    container.innerHTML = news.slice(0, 5).map(n => {
        const d = n.uploadedAt ? new Date(n.uploadedAt) : (n.createdAt ? new Date(n.createdAt) : null);
        let displayDate = '';
        if (d && !isNaN(d)) {
            const dd = String(d.getDate()).padStart(2,'0');
            const mm = String(d.getMonth()+1).padStart(2,'0');
            const yy = String(d.getFullYear()).slice(-2);
            displayDate = `${dd}/${mm}/${yy}`;
        } else {
            displayDate = n.date || '';
        }
        return `
        <div style="display:flex;gap:15px;padding:15px;border:1px solid var(--border);border-radius:10px;margin-bottom:15px;">
            <div style="width:60px;height:60px;background:#e7f2f2;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;">
                ${escapeHtml(n.emoji || '📰')}
            </div>
            <div style="flex:1;">
                <h4 style="font-size:15px;margin-bottom:5px;">${escapeHtml(n.title)}</h4>
                <p style="font-size:13px;color:var(--gray);margin-bottom:8px;">${escapeHtml((n.text || '').substring(0, 100))}...</p>
                <div style="display:flex;gap:15px;font-size:12px;color:var(--gray);">
                    <span><i class="fas fa-calendar"></i> ${displayDate}</span>
                    <span><i class="fas fa-eye"></i> ${n.views || 0} baxış</span>
                </div>
            </div>
            <button class="btn-icon btn-delete" onclick="deleteNews('${escapeHtml(n.id)}')" title="Sil">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    `}).join('');
}

function deleteNews(id) {
    showConfirm('Bu xəbəri silmək istədiyinizdən əminsiniz?', () => {
        API.news.remove(id).then(() => {
            showNotification('Xəbər silindi.', 'success');
            return loadNews();
        }).catch(error => showNotification(error.message || 'Xəbəri silmək mümkün olmadı.', 'error'));
    });
}

loadNews();
});
</script>

<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
