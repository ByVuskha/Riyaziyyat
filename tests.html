<script>
// Load tests from API — replaces MOCK_TESTS + localStorage approach
let _testsCache = [];

async function initTestsPage() {
    const grid = document.getElementById('testsGrid');
    if (grid) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#94a3b8;"><i class="fas fa-circle-notch fa-spin" style="font-size:32px;"></i></div>';
    try {
        const { data } = await API.tests.list({ limit: 100 });
        _testsCache = data.map(t => ({
            id:         t.id,
            title:      t.title,
            emoji:      t.emoji || '📝',
            difficulty: t.difficulty || 'Orta',
            questions:  t.questionCount || (t.questions ? t.questions.length : 0),
            time:       t.duration || 30,
            free:       !t.isPremium,
            desc:       t.description || '',
            attempts:   t.attempts || 0,
            users:      t.uniqueUsers || 0,
            data:       (t.questions || []).map(q => ({ q: q.question, opts: q.options, ans: q.correctAnswer })),
        }));
        renderTests();
    } catch(e) {
        if (grid) grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#ef4444;">${e.message}</div>`;
    }
}
// Keep legacy getAllTests() for quiz engine
function getAllTests() { return _testsCache; }

document.addEventListener('DOMContentLoaded', () => { initTestsPage(); updateNavbar(); });

function renderTests() {
    const allTests = getAllTests();
    const grid = document.getElementById('testsGrid');

    if (allTests.length === 0) {
        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--gray);">
                <div style="font-size:64px;margin-bottom:16px;">📝</div>
                <h3 style="font-size:20px;margin-bottom:8px;color:#374151;">Hələ sınaq yoxdur</h3>
                <p style="font-size:14px;">Admin tərəfindən sınaqlar əlavə ediləcək</p>
            </div>`;
        return;
    }
    
    grid.innerHTML = allTests.map(t => {
        const diffColor = t.difficulty === 'Asan' ? '#10b981' : t.difficulty === 'Orta' ? '#f59e0b' : '#ef4444';
        const diffBg   = t.difficulty === 'Asan' ? '#ecfdf5' : t.difficulty === 'Orta' ? '#fffbeb' : '#fef2f2';
        return `
        <div class="card" style="position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;" 
             onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 12px 32px rgba(0,0,0,0.12)'"
             onmouseout="this.style.transform='';this.style.boxShadow=''">
            
            <!-- Üst şerit: pulsuz / premium -->
            <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${t.free ? 'linear-gradient(90deg,#10b981,#059669)' : 'linear-gradient(90deg,#f59e0b,#d97706)'};"></div>
            
            <!-- Emoji + badge -->
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-top:8px;">
                <div style="font-size:46px;line-height:1;">${t.emoji}</div>
                <span style="padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;
                    background:${t.free ? '#ecfdf5' : '#fef3c7'};
                    color:${t.free ? '#065f46' : '#92400e'};">
                    ${t.free ? '✅ Pulsuz' : '👑 Premium'}
                </span>
            </div>

            <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;color:#1f2937;">${t.title}</h3>
            <p style="color:#6b7280;font-size:13px;margin-bottom:14px;line-height:1.5;">${t.desc}</p>

            <!-- Meta bilgilər -->
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
                <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#6b7280;background:#f3f4f6;padding:4px 10px;border-radius:20px;">
                    <i class="fas fa-question-circle" style="color:#667eea;"></i> ${t.questions} sual
                </span>
                <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#6b7280;background:#f3f4f6;padding:4px 10px;border-radius:20px;">
                    <i class="fas fa-clock" style="color:#10b981;"></i> ${t.time} dəq
                </span>
                <span style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;
                    background:${diffBg};color:${diffColor};">
                    ${t.difficulty}
                </span>
            </div>

            <!-- İstifadəçi statistikası -->
            ${t.attempts > 0 ? `
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;justify-content:space-between;font-size:12px;color:#64748b;">
                <span><i class="fas fa-users" style="color:#667eea;"></i> ${t.users} nəfər həll etdi</span>
                <span><i class="fas fa-chart-line" style="color:#10b981;"></i> ${t.attempts} cəhd</span>
            </div>` : ''}

            <button class="btn btn-primary btn-block" onclick="startTest('${t.id}')"
                style="display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;">
                ${t.free
                    ? '<i class="fas fa-play"></i> Başla'
                    : '<i class="fas fa-crown"></i> Premium ilə Başla'}
            </button>
        </div>
    `}).join('');
}

let currentTest, currentQ = 0, score = 0, answerSelections = [];

async function startTest(id) {
    const user = await API.getCurrentUser();
    if (!user) {
        window.location.href = 'login.html?redirect=tests.html';
        return;
    }
    
    const listing = getAllTests().find(test => String(test.id) === String(id));
    if (!listing) {
        showNotification('Sınaq tapılmadı!', 'error');
        return;
    }
    
    // Premium check
    if (!currentTest.free) {
        if (!isPremiumActive(user)) {
            showPremiumPromptTest();
            return;
        }
    }

    try {
        const test = await API.tests.get(id);
        currentTest = {
            ...listing,
            id: test.id,
            title: test.title,
            questions: test.questions.length,
            data: test.questions.map(question => ({ q: question.question, opts: question.options })),
        };
    } catch (error) {
        if (error.status === 403) showPremiumPromptTest();
        else showNotification(error.message || 'Sınağı açmaq mümkün olmadı.', 'error');
        return;
    }
    
    currentQ = 0;
    score = 0;
    answerSelections = new Array(currentTest.questions).fill(null);
    showQuestion();
}

function showPremiumPromptTest(expired = false) {
    const user = getCurrentUser();
    const hasPending = user && user.premiumRequestedAt;
    
    const overlay = document.createElement('div');
    overlay.id = 'premiumPromptOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    
    overlay.innerHTML = `
        <div style="background:white;border-radius:20px;padding:35px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div style="font-size:60px;margin-bottom:15px;">👑</div>
            <h2 style="margin:0 0 10px 0;font-size:24px;color:#1f2937;">
                ${expired ? 'Premium Müddəti Bitib' : 'Premium Sınaq'}
            </h2>
            <p style="color:#6b7280;margin:0 0 25px 0;line-height:1.6;">
                Bu sınaq yalnız premium üzvlər üçündür. Bütün sınaqlardan istifadə üçün premium olun!
            </p>
            
            ${hasPending ? `
                <div style="background:#fef3c7;border-radius:12px;padding:16px;margin-bottom:20px;">
                    <p style="margin:0;color:#92400e;font-size:14px;"><i class="fas fa-clock"></i> Müraciətiniz admin tərəfindən yoxlanılır.</p>
                </div>
            ` : `
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">
                    <div style="background:#f0f9ff;border-radius:10px;padding:12px;cursor:pointer;border:2px solid transparent;" onclick="selectTestPlan(this,'premium1',1,15)">
                        <div style="font-weight:700;color:#667eea;">15 ₼</div>
                        <div style="font-size:12px;color:#6b7280;">1 Ay</div>
                    </div>
                    <div style="background:#f5f3ff;border-radius:10px;padding:12px;cursor:pointer;border:2px solid #8b5cf6;" onclick="selectTestPlan(this,'premium6',6,75)">
                        <div style="font-weight:700;color:#8b5cf6;">75 ₼</div>
                        <div style="font-size:12px;color:#6b7280;">6 Ay</div>
                        <div style="font-size:10px;color:#10b981;">-17%</div>
                    </div>
                    <div style="background:#fffbeb;border-radius:10px;padding:12px;cursor:pointer;border:2px solid transparent;" onclick="selectTestPlan(this,'premium12',12,120)">
                        <div style="font-weight:700;color:#f59e0b;">120 ₼</div>
                        <div style="font-size:12px;color:#6b7280;">1 İl</div>
                        <div style="font-size:10px;color:#10b981;">-33%</div>
                    </div>
                </div>
            `}
            
            <div style="display:flex;gap:12px;">
                <button onclick="document.getElementById('premiumPromptOverlay').remove()"
                    style="flex:1;padding:12px;border:2px solid #e5e7eb;background:white;border-radius:10px;font-weight:600;cursor:pointer;color:#6b7280;">
                    Bağla
                </button>
                ${hasPending ? `
                    <button onclick="document.getElementById('premiumPromptOverlay').remove()"
                        style="flex:2;padding:12px;background:#f59e0b;color:white;border-radius:10px;font-weight:600;cursor:pointer;border:none;">
                        <i class="fas fa-clock"></i> Gözlənilir...
                    </button>
                ` : `
                    <button id="testPromptBtn" onclick="submitTestPremiumRequest()"
                        style="flex:2;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:10px;font-weight:600;cursor:pointer;border:none;">
                        <i class="fas fa-paper-plane"></i> Müraciət Et
                    </button>
                `}
            </div>
        </div>
    `;
    
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    window._selectedTestPlan = { planId: 'premium6', months: 6, price: 75 };
}

function selectTestPlan(el, planId, months, price) {
    document.querySelectorAll('#premiumPromptOverlay [onclick^="selectTestPlan"]').forEach(e => e.style.border = '2px solid transparent');
    el.style.border = '2px solid #667eea';
    window._selectedTestPlan = { planId, months, price };
}

async function submitTestPremiumRequest() {
    const plan = window._selectedTestPlan;
    if (!plan) return;
    
    const user = await API.getCurrentUser();
    if (!user) { window.location.href = 'login.html'; return; }
    
    const btn = document.getElementById('testPromptBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }
    
    try {
        const request = await API.premium.request(plan.planId || 'premium6');
        user.premiumRequestedAt = request.requestedAt;
        user.requestedPlan = plan;
        API.setCachedUser(user);
        document.getElementById('premiumPromptOverlay')?.remove();
        showNotification('✅ Müraciətiniz göndərildi! Admin tərəfindən yoxlanılacaq.', 'success');
    } catch (error) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Müraciət et'; }
        showNotification(error.message || 'Müraciəti göndərmək mümkün olmadı.', 'error');
    }
}

/* ── Quiz timer state ────────────────────────────────────────────────── */
let _quizTimer      = null;   // CircularTimer instance
let _quizTimerTick  = null;   // setInterval id
let _quizSecsLeft   = 0;
let _quizTotalSecs  = 0;

function showQuestion() {
    const q         = currentTest.data[currentQ];
    const totalQs   = currentTest.questions;
    const progress  = Math.round(((currentQ) / totalQs) * 100);

    /* Total seconds for this test (duration in minutes × 60 / questions) */
    const secsPerQ  = Math.max(20, Math.floor(((currentTest.time || 30) * 60) / totalQs));
    _quizSecsLeft   = secsPerQ;
    _quizTotalSecs  = secsPerQ;

    const modal = document.createElement('div');
    modal.id = 'quizModal';
    modal.style.cssText = [
        'position:fixed;top:0;left:0;right:0;bottom:0;',
        'background:rgba(8,14,33,0.82);backdrop-filter:blur(6px);',
        'display:flex;align-items:center;justify-content:center;',
        'z-index:9999;padding:16px;'
    ].join('');

    modal.innerHTML = `
        <div style="
            background:white;border-radius:20px;padding:28px 28px 22px;
            max-width:600px;width:100%;position:relative;overflow:hidden;
            box-shadow:0 24px 60px rgba(8,14,33,0.35);
            animation:modalIn 0.3s ease;
        ">
            <!-- Math accent line on top -->
            <div style="
                position:absolute;top:0;left:0;right:0;height:4px;
                background:linear-gradient(90deg,#4338ca,#7c3aed,#06b6d4);
            "></div>

            <!-- Header row -->
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
                <!-- Circular timer -->
                <div id="timerWrap" style="flex-shrink:0;"></div>

                <div style="flex:1;">
                    <!-- Progress bar -->
                    <div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:5px;">
                        <span>Sual ${currentQ + 1} / ${totalQs}</span>
                        <span>${currentTest.title}</span>
                    </div>
                    <div style="background:#f1f5f9;border-radius:10px;height:6px;overflow:hidden;">
                        <div id="qProgress" style="
                            height:100%;border-radius:10px;
                            background:linear-gradient(90deg,#4338ca,#7c3aed);
                            width:${progress}%;
                            transition:width 0.5s ease;
                        "></div>
                    </div>
                </div>

                <button onclick="closeQuiz()" style="
                    background:rgba(67,56,202,0.08);border:none;
                    width:34px;height:34px;border-radius:50%;
                    cursor:pointer;font-size:18px;color:#64748b;
                    display:flex;align-items:center;justify-content:center;
                    transition:all 0.2s;flex-shrink:0;
                " onmouseover="this.style.background='rgba(239,68,68,0.1)';this.style.color='#ef4444'"
                   onmouseout="this.style.background='rgba(67,56,202,0.08)';this.style.color='#64748b'">&times;</button>
            </div>

            <!-- Question text -->
            <h3 style="
                font-size:18px;font-weight:700;margin:0 0 22px;
                color:#1e293b;line-height:1.5;
            ">${q.q}</h3>

            <!-- Options -->
            <div id="options" style="display:flex;flex-direction:column;gap:10px;">
                ${q.opts.map((opt, i) => `
                <button class="answer-option" data-idx="${i}" onclick="selectAnswer(${i})"
                    style="
                        width:100%;padding:14px 16px;
                        border:2px solid #e2e8f0;border-radius:10px;
                        background:white;text-align:left;cursor:pointer;
                        font-size:15px;color:#1e293b;
                        display:flex;align-items:center;gap:12px;
                        transition:all 0.22s;
                    "
                    onmouseover="if(!this.disabled){this.style.borderColor='#4338ca';this.style.background='rgba(67,56,202,0.04)'}"
                    onmouseout="if(!this.disabled&&!this.classList.contains('correct')&&!this.classList.contains('wrong')){this.style.borderColor='#e2e8f0';this.style.background='white'}"
                >
                    <span style="
                        width:28px;height:28px;border-radius:8px;
                        background:#f1f5f9;color:#64748b;
                        font-size:13px;font-weight:700;
                        display:flex;align-items:center;justify-content:center;
                        flex-shrink:0;
                    ">${['A','B','C','D','E'][i]}</span>
                    <span style="flex:1;">${opt}</span>
                </button>`).join('')}
            </div>

            <!-- Feedback + Next -->
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px;min-height:38px;">
                <div id="feedback" style="font-size:15px;font-weight:700;"></div>
                <button id="nextBtn" onclick="nextQuestion()" class="btn btn-primary"
                    style="display:none;padding:10px 24px;">
                    ${currentQ + 1 < totalQs ? 'Növbəti <i class="fas fa-arrow-right"></i>' : 'Nəticəni Gör <i class="fas fa-flag-checkered"></i>'}
                </button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    /* Start circular timer */
    const timerWrap = document.getElementById('timerWrap');
    if (timerWrap && typeof CircularTimer === 'function') {
        _quizTimer = CircularTimer(timerWrap, _quizTotalSecs);
        _quizTimer.update(_quizSecsLeft);

        clearInterval(_quizTimerTick);
        _quizTimerTick = setInterval(() => {
            _quizSecsLeft--;
            if (_quizTimer) _quizTimer.update(_quizSecsLeft);
            if (_quizSecsLeft <= 0) {
                clearInterval(_quizTimerTick);
                /* Auto-advance: treat as wrong answer */
                const btns = document.querySelectorAll('#options button');
                btns.forEach(b => b.disabled = true);
                const fb = document.getElementById('feedback');
                if (fb) fb.innerHTML = '<span style="color:#f59e0b;">Vaxt bitdi. Cavab qeydə alınmadı.</span>';
                const nb = document.getElementById('nextBtn');
                if (nb) nb.style.display = 'block';
            }
        }, 1000);
    }
}

function selectAnswer(idx) {
    const btns = document.querySelectorAll('#options button');
    btns.forEach(b => b.disabled = true);

    clearInterval(_quizTimerTick);
    answerSelections[currentQ] = idx;
    const fb = document.getElementById('feedback');
    if (btns[idx]) btns[idx].classList.add('selected');
    if (fb) fb.innerHTML = '<span style="color:#0f766e;">Cavab qeydə alındı.</span>';

    const nb = document.getElementById('nextBtn');
    if (nb) nb.style.display = 'block';
}

function nextQuestion() {
    clearInterval(_quizTimerTick);
    if (_quizTimer) { _quizTimer.destroy(); _quizTimer = null; }
    currentQ++;
    closeQuiz();
    if (currentQ < currentTest.questions) {
        showQuestion();
    } else {
        showResult();
    }
}

async function showResult() {
    const user = await API.getCurrentUser();
    if (!user) {
        showNotification('Nəticəni saxlamaq üçün hesabınıza daxil olun.', 'warning');
        return;
    }

    let result;
    try {
        result = await API.points.awardTest(currentTest.id, answerSelections);
    } catch (error) {
        showNotification(error.message || 'Nəticəni serverdə hesablamaq mümkün olmadı.', 'error');
        return;
    }
    score = result.score;
    const pct = result.ballScore;
    const ballScore = result.ballScore;
    const earnedPoints = result.earnedPoints || 0;
    const alreadyEarned = result.alreadyCompleted;
    window.dispatchEvent(new CustomEvent('points:updated', { detail: { userId: user.id } }));

    // Grade label (100-ballıq)
    const grade = ballScore === 100 ? '🏆 Mükəmməl'
                : ballScore >= 80  ? '🌟 Əla'
                : ballScore >= 60  ? '👍 Yaxşı'
                : ballScore >= 40  ? '📖 Qənaətbəxş'
                : '📚 Zəif';
    const gradeColor = ballScore >= 60 ? '#10b981' : ballScore >= 40 ? '#f59e0b' : '#ef4444';
    const wrong = currentTest.questions - score;

    const modal = document.createElement('div');
    modal.id = 'resultModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,14,33,0.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
    modal.innerHTML = `
        <div style="background:white;border-radius:20px;padding:32px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:92vh;overflow-y:auto;position:relative;overflow-x:hidden;">
            <!-- Gradient top bar -->
            <div style="position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#4338ca,#7c3aed,#06b6d4,#f59e0b);border-radius:20px 20px 0 0;"></div>

            <!-- 100-ballıq böyük göstərici -->
            <div style="background:linear-gradient(135deg,#0d1b3e,#4338ca,#7c3aed);border-radius:16px;padding:22px 20px;margin:8px 0 20px;position:relative;overflow:hidden;">
                <div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);"></div>
                <div style="font-size:13px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Sınaq Balı</div>
                <div style="font-size:72px;font-weight:900;color:white;line-height:1;">${ballScore}</div>
                <div style="font-size:14px;color:rgba(255,255,255,.6);margin-top:2px;">100 bal üzərindən</div>
                <div style="margin-top:10px;display:inline-block;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 16px;font-size:13px;font-weight:700;color:white;">${grade}</div>
            </div>

            <!-- Animated progress bar -->
            <div style="margin-bottom:18px;">
                <div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:6px;">
                    <span>Nəticə</span><span>${pct}%</span>
                </div>
                <div class="result-bar-wrap">
                    <div class="result-bar" id="resultBarFill"></div>
                </div>
            </div>

            <h3 style="font-size:16px;font-weight:700;color:#1f2937;margin-bottom:4px;">${currentTest.title}</h3>
            <p style="color:#9ca3af;font-size:13px;margin-bottom:18px;">${currentTest.questions} sual · ${currentTest.time || currentTest.duration || '?'} dəq</p>

            <!-- Stats üçlüyü -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;">
                <div style="background:#ecfdf5;border-radius:12px;padding:14px 8px;">
                    <div style="font-size:24px;font-weight:800;color:#10b981;">${score}</div>
                    <div style="font-size:11px;color:#6b7280;">Düzgün</div>
                </div>
                <div style="background:#fef2f2;border-radius:12px;padding:14px 8px;">
                    <div style="font-size:24px;font-weight:800;color:#ef4444;">${wrong}</div>
                    <div style="font-size:11px;color:#6b7280;">Səhv</div>
                </div>
                <div style="background:#eef2ff;border-radius:12px;padding:14px 8px;">
                    <div style="font-size:24px;font-weight:800;color:#4338ca;">${pct}%</div>
                    <div style="font-size:11px;color:#6b7280;">Faiz</div>
                </div>
            </div>

            <!-- Qazanılan xal -->
            ${earnedPoints > 0 ? `
                <div style="background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:12px;padding:11px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <span style="font-size:20px;">🎉</span>
                    <span style="color:white;font-weight:700;font-size:16px;">+${earnedPoints} xal qazandınız!</span>
                </div>
            ` : alreadyEarned ? `
                <div style="background:#f3f4f6;border-radius:12px;padding:10px 16px;margin-bottom:18px;">
                    <div style="color:#6b7280;font-size:13px;"><i class="fas fa-info-circle"></i> Bu sınaqdan artıq xal qazanmısınız</div>
                </div>
            ` : ''}

            <!-- Buttons -->
            <div style="display:flex;gap:10px;">
                <button onclick="closeResult()" class="btn btn-secondary" style="flex:1;padding:13px;font-size:14px;">
                    Bağla
                </button>
                <a href="success.html?celebrate=1&score=${pct}" class="btn btn-primary" style="flex:1;padding:13px;font-size:14px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;">
                    <i class="fas fa-trophy"></i> Uğurlar
                </a>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    /* ── Animated progress bar ── */
    requestAnimationFrame(() => {
        const barEl = document.getElementById('resultBarFill');
        if (barEl && typeof AnimateResultBar === 'function') {
            AnimateResultBar(barEl, pct);
        } else if (barEl) {
            setTimeout(() => { barEl.style.width = pct + '%'; }, 50);
        }
    });

    /* ── Confetti burst on decent results ── */
    if (pct >= 60 && typeof Confetti !== 'undefined') {
        const delay = pct === 100 ? 0 : 300;
        setTimeout(() => {
            Confetti.burst({
                count   : pct === 100 ? 180 : 100,
                math    : pct < 80,
                duration: pct === 100 ? 5000 : 3500,
            });
        }, delay);
    }
}

function closeQuiz() {
    clearInterval(_quizTimerTick);
    if (_quizTimer) { _quizTimer.destroy(); _quizTimer = null; }
    const modal = document.getElementById('quizModal');
    if (modal) modal.remove();
}

function closeResult() {
    const modal = document.getElementById('resultModal');
    if (modal) modal.remove();
}

renderTests();

// Re-render after Upstash loads fresh data
window.addEventListener('upstash:loaded', renderTests);
</script>
<script src="js/notifications.js"></script>
<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
