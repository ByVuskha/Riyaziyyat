                <span class="balance-badge" id="balanceBadge">

<section style="background:linear-gradient(135deg,#065f46,#10b981);color:white;padding:60px 0 40px;">
    <div class="container">
        <h1 style="font-size:38px;font-weight:800;margin-bottom:10px;">📝 Sınaqlar</h1>
        <p style="opacity:0.9;">Bilikini yoxla, nəticəni analiz et</p>
    </div>
</section>

<div class="container" style="padding:40px 0;">
    <div id="testsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:25px;"></div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2026 Bizim Riyaziyyat. Bütün hüquqlar qorunur.</p>
        </div>
    </div>
</footer>

<script src="js/config.js"></script>
<script src="js/upstash.js"></script>
<script src="js/storage-wrapper.js"></script>
<script src="js/navbar.js"></script>
<script src="js/mobile-menu.js"></script>
<script src="js/auth.js"></script>
<script>
const MOCK_TESTS = [
    {
        id: 1, title: 'Cəbr - Əsas', emoji: '🔢', difficulty: 'Asan',
        questions: 5, time: 10, free: true, desc: 'Xətti tənliklər',
        data: [
            { q: '2x + 4 = 10, x = ?', opts: ['2', '3', '4', '5'], ans: 1 },
            { q: '3(x-2) = 9, x = ?', opts: ['3', '4', '5', '6'], ans: 2 },
            { q: 'x² = 16, x = ?', opts: ['2', '4', '8', '16'], ans: 1 },
            { q: '5x-3 = 2x+9, x = ?', opts: ['2', '3', '4', '5'], ans: 2 },
            { q: '(x+3)(x-2) = 0, x = ?', opts: ['-3 və 2', '3 və -2', '-3 və -2', '3 və 2'], ans: 0 }
        ]
    },
    {
        id: 2, title: 'Həndəsə - Üçbucaq', emoji: '📐', difficulty: 'Orta',
        questions: 4, time: 8, free: true, desc: 'Üçbucaqlar',
        data: [
            { q: 'Üçbucağın bucaqları cəmi?', opts: ['90°', '180°', '270°', '360°'], ans: 1 },
            { q: 'Düzbucaqlı üçbucaqda hipotenuz?', opts: ['Kiçik', 'Böyük', 'Orta', 'İstənilən'], ans: 1 },
            { q: 'Bərabərtərəfli üçbucaqda bucaq?', opts: ['45°', '60°', '90°', '120°'], ans: 1 },
            { q: 'Pifaqor teoremi hansı üçbucaqda?', opts: ['Hamısında', 'Düzbucaqlı', 'Bərabərtərəfli', 'Bərabəryanlı'], ans: 1 }
        ]
    },
    {
        id: 3, title: 'Analiz - Limit', emoji: '∫', difficulty: 'Çətin',
        questions: 3, time: 6, free: false, desc: 'Limitlər',
        data: [
            { q: 'lim(x→0) sin(x)/x = ?', opts: ['0', '1', '∞', 'Yoxdur'], ans: 1 },
            { q: 'lim(x→∞) 1/x = ?', opts: ['-∞', '0', '1', '∞'], ans: 1 },
            { q: 'lim(x→2) (x²-4)/(x-2) = ?', opts: ['0', '2', '4', 'Yoxdur'], ans: 2 }
        ]
    }
];

// Yüklənmiş sınaqları əlavə et
function getAllTests() {
    const uploadedTests = Storage.get('tests') || [];
    const stats = Storage.get('testStats') || {};
    
    // Yüklənmiş sınaqları formatlayaq
    const formattedTests = uploadedTests.map(t => {
        const testStats = stats[t.id] || stats['uploaded_' + t.id] || { totalAttempts: 0, uniqueUsers: [] };
        
        return {
            id: 'uploaded_' + t.id,
            title: t.title,
            emoji: '📝',
            difficulty: t.difficulty || 'Orta',
            questions: t.questions?.length || 0,
            time: t.duration || 10,
            free: !t.isPremium,
            desc: t.description || '',
            attempts: testStats.totalAttempts || 0,
            users: (testStats.uniqueUsers || []).length,
            data: (t.questions || []).map(q => ({
                q: q.question,
                opts: q.options,
                ans: q.correctAnswer
            }))
        };
    });
    
    // MOCK_TESTS-ə də statistika əlavə et
    const mockWithStats = MOCK_TESTS.map(t => {
        const testStats = stats[t.id] || { totalAttempts: 0, uniqueUsers: [] };
        return {
            ...t,
            attempts: testStats.totalAttempts || 0,
            users: (testStats.uniqueUsers || []).length
        };
    });
    
    return [...formattedTests, ...mockWithStats];
}

function renderTests() {
    const allTests = getAllTests();
    const grid = document.getElementById('testsGrid');
    
    if (allTests.length === 0) {
        grid.innerHTML = '<p style="text-align:center;color:var(--gray);padding:40px;">Sınaq tapılmadı</p>';
        return;
    }
    
    grid.innerHTML = allTests.map(t => `
        <div class="card">
            <div style="font-size:48px;text-align:center;margin-bottom:15px;">${t.emoji}</div>
            <h3 style="font-size:18px;margin-bottom:8px;">${t.title}</h3>
            <p style="color:var(--gray);font-size:14px;margin-bottom:15px;">${t.desc}</p>
            <div style="display:flex;gap:12px;margin-bottom:15px;font-size:13px;color:var(--gray);">
                <span><i class="fas fa-question-circle"></i> ${t.questions}</span>
                <span><i class="fas fa-clock"></i> ${t.time} dəq</span>
                <span class="badge badge-${t.difficulty === 'Asan' ? 'success' : t.difficulty === 'Orta' ? 'warning' : 'danger'}">${t.difficulty}</span>
            </div>
            ${t.attempts > 0 ? `<div style="background:#f0f9ff;color:#0369a1;padding:6px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;display:flex;justify-content:space-between;"><span><i class="fas fa-users"></i> ${t.users} nəfər</span><span><i class="fas fa-chart-line"></i> ${t.attempts} cəhd</span></div>` : ''}
            ${!t.free ? '<div style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;"><i class="fas fa-crown"></i> Premium</div>' : ''}
            ${typeof t.id === 'string' && t.id.includes('uploaded') ? '<div style="background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;"><i class="fas fa-upload"></i> Yüklənmiş</div>' : ''}
            <button class="btn btn-primary btn-block" onclick="startTest('${t.id}')">
                <i class="fas fa-play"></i> Başla
            </button>
        </div>
    `).join('');
}

let currentTest, currentQ = 0, score = 0;

function startTest(id) {
    if (!isLoggedIn()) {
        alert('Giriş etməlisiniz!');
        window.location.href = 'login.html';
        return;
    }
    
    const allTests = getAllTests();
    currentTest = allTests.find(t => t.id == id);
    
    if (!currentTest) {
        alert('Sınaq tapılmadı!');
        return;
    }
    
    const user = getCurrentUser();
    
    if (!currentTest.free && user.balance < 5) {
        alert('Premium sınaq! Balans yükləyin.');
        return;
    }
    
    currentQ = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    const q = currentTest.data[currentQ];
    const modal = document.createElement('div');
    modal.id = 'quizModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = `
        <div style="background:white;border-radius:15px;padding:30px;max-width:600px;width:90%;">
            <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                <span style="color:var(--gray);">Sual ${currentQ + 1}/${currentTest.questions}</span>
                <button onclick="closeQuiz()" style="background:none;border:none;font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <h3 style="font-size:20px;margin-bottom:25px;">${q.q}</h3>
            <div id="options">${q.opts.map((opt, i) => `
                <button onclick="selectAnswer(${i})" style="display:block;width:100%;padding:15px;margin-bottom:10px;border:2px solid var(--border);border-radius:10px;background:white;text-align:left;cursor:pointer;font-size:15px;">
                    ${opt}
                </button>
            `).join('')}</div>
            <div id="feedback" style="margin-top:20px;font-weight:600;"></div>
            <button id="nextBtn" onclick="nextQuestion()" style="display:none;margin-top:15px;" class="btn btn-primary">Növbəti</button>
        </div>
    `;
    document.body.appendChild(modal);
}

function selectAnswer(idx) {
    const q = currentTest.data[currentQ];
    const btns = document.querySelectorAll('#options button');
    btns.forEach(b => b.disabled = true);
    
    if (idx === q.ans) {
        btns[idx].style.background = '#ecfdf5';
        btns[idx].style.borderColor = '#10b981';
        document.getElementById('feedback').innerHTML = '<span style="color:#10b981;">✓ Düzgün!</span>';
        score++;
    } else {
        btns[idx].style.background = '#fef2f2';
        btns[idx].style.borderColor = '#ef4444';
        btns[q.ans].style.background = '#ecfdf5';
        btns[q.ans].style.borderColor = '#10b981';
        document.getElementById('feedback').innerHTML = '<span style="color:#ef4444;">✗ Səhv</span>';
    }
    
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    currentQ++;
    closeQuiz();
    if (currentQ < currentTest.questions) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    const pct = Math.round((score / currentTest.questions) * 100);
    const user = getCurrentUser();
    
    // Nəticəni saxla
    saveTestResult({
        testId: currentTest.id,
        testTitle: currentTest.title,
        userId: user.id,
        userName: user.name,
        userEmail: user.email,
        score: score,
        total: currentTest.questions,
        percentage: pct,
        date: new Date().toISOString(),
        timestamp: Date.now()
    });
    
    // Sınaq statistikasını yenilə
    updateTestStats(currentTest.id);
    
    const modal = document.createElement('div');
    modal.id = 'resultModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = `
        <div style="background:white;border-radius:15px;padding:40px;max-width:400px;width:90%;text-align:center;">
            <div style="font-size:60px;margin-bottom:20px;">${pct >= 80 ? '🏆' : pct >= 60 ? '👍' : '📚'}</div>
            <h2 style="font-size:48px;font-weight:800;color:${pct >= 60 ? '#10b981' : '#ef4444'};margin-bottom:10px;">${score}/${currentTest.questions}</h2>
            <p style="color:var(--gray);margin-bottom:25px;">${pct >= 80 ? 'Əla!' : pct >= 60 ? 'Yaxşı!' : 'Daha çox məşq lazımdır'}</p>
            <button onclick="closeResult()" class="btn btn-primary">Bağla</button>
        </div>
    `;
    document.body.appendChild(modal);
}

function closeQuiz() {
    const modal = document.getElementById('quizModal');
    if (modal) modal.remove();
}

function closeResult() {
    const modal = document.getElementById('resultModal');
    if (modal) modal.remove();
}

// Sınaq nəticəsini saxla
function saveTestResult(result) {
    const results = Storage.get('testResults') || [];
    results.push(result);
    Storage.set('testResults', results);
    console.log('✅ Nəticə saxlanıldı:', result);
}

// Sınaq statistikasını yenilə
function updateTestStats(testId) {
    const stats = Storage.get('testStats') || {};
    
    if (!stats[testId]) {
        stats[testId] = {
            testId: testId,
            totalAttempts: 0,
            uniqueUsers: new Set()
        };
    }
    
    stats[testId].totalAttempts++;
    
    const user = getCurrentUser();
    if (user && user.email) {
        if (!stats[testId].uniqueUsers) {
            stats[testId].uniqueUsers = new Set();
        }
        stats[testId].uniqueUsers.add(user.email);
    }
    
    // Set-i array-ə çevir (localStorage üçün)
    const statsToSave = {};
    for (const [key, value] of Object.entries(stats)) {
        statsToSave[key] = {
            testId: value.testId,
            totalAttempts: value.totalAttempts,
            uniqueUsers: Array.from(value.uniqueUsers || [])
        };
    }
    
    Storage.set('testStats', statsToSave);
    console.log('📊 Statistika yeniləndi:', statsToSave[testId]);
}

renderTests();

// Load from Upstash on page load
if (typeof loadFromUpstash !== 'undefined') {
    console.log('📥 Upstash-dan yüklənir...');
    loadFromUpstash().then(() => {
        console.log('✅ Upstash-dan yükləndi, testlər yenilənir...');
        renderTests(); // Re-render after loading
    }).catch(err => {
        console.error('❌ Upstash yükləmə xətası:', err);
    });
}
</script>
</body>
