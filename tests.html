<script>
const MOCK_TESTS = [
    {
        id: 'mock_free_1',
        title: 'Ədədi İfadələr - Nümunə',
        emoji: '🔢',
        difficulty: 'Asan',
        questions: 5,
        time: 5,
        free: true,
        desc: 'Tam ədədlər, toplama və çıxma əməlləri üzrə pulsuz nümunə sınaq.',
        attempts: 128,
        users: 74,
        data: [
            { q: '15 + 27 = ?', opts: ['40', '42', '43', '41'], ans: 1 },
            { q: '100 - 63 = ?', opts: ['47', '37', '27', '57'], ans: 1 },
            { q: '8 × 7 = ?', opts: ['54', '56', '58', '52'], ans: 1 },
            { q: '144 ÷ 12 = ?', opts: ['10', '11', '12', '13'], ans: 2 },
            { q: 'Ən kiçik üç rəqəmli ədəd hansıdır?', opts: ['100', '99', '101', '109'], ans: 0 }
        ]
    },
    {
        id: 'mock_premium_1',
        title: 'Cəbr - Tənliklər (Premium)',
        emoji: '👑',
        difficulty: 'Orta',
        questions: 10,
        time: 15,
        free: false,
        desc: 'Birməchullu və ikimechullu tənliklər üzrə dərin bilik yoxlaması.',
        attempts: 56,
        users: 31,
        data: [
            { q: '2x + 5 = 13 → x = ?', opts: ['3', '4', '5', '6'], ans: 1 },
            { q: '3x - 7 = 11 → x = ?', opts: ['4', '5', '6', '7'], ans: 2 },
            { q: 'x² = 81 → x = ?', opts: ['7', '8', '9', '10'], ans: 2 },
            { q: '5x = 45 → x = ?', opts: ['7', '8', '9', '10'], ans: 2 },
            { q: 'x/4 = 6 → x = ?', opts: ['18', '20', '22', '24'], ans: 3 },
            { q: '2x + 3y = 12, x=3 olduqda y = ?', opts: ['1', '2', '3', '4'], ans: 1 },
            { q: '(x+3)(x-3) = ?', opts: ['x²-6', 'x²-9', 'x²+9', 'x²-6x'], ans: 1 },
            { q: 'x² - 5x + 6 = 0 tənliyinin kökləri?', opts: ['2 və 3', '1 və 6', '2 və 4', '3 və 4'], ans: 0 },
            { q: '|x - 2| = 5 → x = ?', opts: ['3 və -7', '7 və -3', '7 və 3', '-7 və 3'], ans: 1 },
            { q: 'log₂(8) = ?', opts: ['2', '3', '4', '8'], ans: 1 }
        ]
    }
];

// Yüklənmiş sınaqları əlavə et
function getAllTests() {
    const uploadedTests = Storage.get('tests') || [];
    const stats = Storage.get('testStats') || {};

    const uploaded = uploadedTests.map(t => {
        const testStats = stats[t.id] || stats['uploaded_' + t.id] || { totalAttempts: 0, uniqueUsers: [] };
        return {
            id: 'uploaded_' + t.id,
            title: t.title,
            emoji: t.emoji || '📝',
            difficulty: t.difficulty || 'Orta',
            questions: t.questions?.length || 0,
            time: t.duration || 10,
            free: !t.isPremium,
            desc: t.description || '',
            attempts: testStats.totalAttempts || 0,
            users: (testStats.uniqueUsers || []).length,
            data: (t.questions || []).map(q => ({
                q: q.question,
                opts: q.options,
                ans: q.correctAnswer
            }))
        };
    });

    // MOCK_TESTS-i əvvəldə göstər (nümunə olaraq)
    const mockWithStats = MOCK_TESTS.map(t => {
        const s = stats[t.id] || { totalAttempts: 0, uniqueUsers: [] };
        return {
            ...t,
            attempts: s.totalAttempts || t.attempts || 0,
            users: (s.uniqueUsers || []).length || t.users || 0
        };
    });

    return [...mockWithStats, ...uploaded];
}

function renderTests() {
    const allTests = getAllTests();
    const grid = document.getElementById('testsGrid');

    if (allTests.length === 0) {
        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--gray);">
                <div style="font-size:64px;margin-bottom:16px;">📝</div>
                <h3 style="font-size:20px;margin-bottom:8px;color:#374151;">Hələ sınaq yoxdur</h3>
                <p style="font-size:14px;">Admin tərəfindən sınaqlar əlavə ediləcək</p>
            </div>`;
        return;
    }
    
    grid.innerHTML = allTests.map(t => {
        const diffColor = t.difficulty === 'Asan' ? '#10b981' : t.difficulty === 'Orta' ? '#f59e0b' : '#ef4444';
        const diffBg   = t.difficulty === 'Asan' ? '#ecfdf5' : t.difficulty === 'Orta' ? '#fffbeb' : '#fef2f2';
        return `
        <div class="card" style="position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;" 
             onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 12px 32px rgba(0,0,0,0.12)'"
             onmouseout="this.style.transform='';this.style.boxShadow=''">
            
            <!-- Üst şerit: pulsuz / premium -->
            <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${t.free ? 'linear-gradient(90deg,#10b981,#059669)' : 'linear-gradient(90deg,#f59e0b,#d97706)'};"></div>
            
            <!-- Emoji + badge -->
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-top:8px;">
                <div style="font-size:46px;line-height:1;">${t.emoji}</div>
                <span style="padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;
                    background:${t.free ? '#ecfdf5' : '#fef3c7'};
                    color:${t.free ? '#065f46' : '#92400e'};">
                    ${t.free ? '✅ Pulsuz' : '👑 Premium'}
                </span>
            </div>

            <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;color:#1f2937;">${t.title}</h3>
            <p style="color:#6b7280;font-size:13px;margin-bottom:14px;line-height:1.5;">${t.desc}</p>

            <!-- Meta bilgilər -->
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
                <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#6b7280;background:#f3f4f6;padding:4px 10px;border-radius:20px;">
                    <i class="fas fa-question-circle" style="color:#667eea;"></i> ${t.questions} sual
                </span>
                <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#6b7280;background:#f3f4f6;padding:4px 10px;border-radius:20px;">
                    <i class="fas fa-clock" style="color:#10b981;"></i> ${t.time} dəq
                </span>
                <span style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;
                    background:${diffBg};color:${diffColor};">
                    ${t.difficulty}
                </span>
            </div>

            <!-- İstifadəçi statistikası -->
            ${t.attempts > 0 ? `
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;justify-content:space-between;font-size:12px;color:#64748b;">
                <span><i class="fas fa-users" style="color:#667eea;"></i> ${t.users} nəfər həll etdi</span>
                <span><i class="fas fa-chart-line" style="color:#10b981;"></i> ${t.attempts} cəhd</span>
            </div>` : ''}

            <button class="btn btn-primary btn-block" onclick="startTest('${t.id}')"
                style="display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;">
                ${t.free
                    ? '<i class="fas fa-play"></i> Başla'
                    : '<i class="fas fa-crown"></i> Premium ilə Başla'}
            </button>
        </div>
    `}).join('');
}

let currentTest, currentQ = 0, score = 0;

function startTest(id) {
    if (!isLoggedIn()) {
        window.location.href = 'login.html';
        return;
    }
    
    const allTests = getAllTests();
    currentTest = allTests.find(t => t.id == id);
    
    if (!currentTest) {
        alert('Sınaq tapılmadı!');
        return;
    }
    
    const user = getCurrentUser();
    
    // Premium check
    if (!currentTest.free) {
        if (!user.premium) {
            showPremiumPromptTest();
            return;
        }
        if (user.premiumExpiresAt && new Date(user.premiumExpiresAt) < new Date()) {
            showPremiumPromptTest(true);
            return;
        }
    }
    
    currentQ = 0;
    score = 0;
    showQuestion();
}

function showPremiumPromptTest(expired = false) {
    const user = getCurrentUser();
    const hasPending = user && user.premiumRequestedAt;
    
    const overlay = document.createElement('div');
    overlay.id = 'premiumPromptOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    
    overlay.innerHTML = `
        <div style="background:white;border-radius:20px;padding:35px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div style="font-size:60px;margin-bottom:15px;">👑</div>
            <h2 style="margin:0 0 10px 0;font-size:24px;color:#1f2937;">
                ${expired ? 'Premium Müddəti Bitib' : 'Premium Sınaq'}
            </h2>
            <p style="color:#6b7280;margin:0 0 25px 0;line-height:1.6;">
                Bu sınaq yalnız premium üzvlər üçündür. Bütün sınaqlardan istifadə üçün premium olun!
            </p>
            
            ${hasPending ? `
                <div style="background:#fef3c7;border-radius:12px;padding:16px;margin-bottom:20px;">
                    <p style="margin:0;color:#92400e;font-size:14px;"><i class="fas fa-clock"></i> Müraciətiniz admin tərəfindən yoxlanılır.</p>
                </div>
            ` : `
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">
                    <div style="background:#f0f9ff;border-radius:10px;padding:12px;cursor:pointer;border:2px solid transparent;" onclick="selectTestPlan(this,'premium1',1,15)">
                        <div style="font-weight:700;color:#667eea;">15 ₼</div>
                        <div style="font-size:12px;color:#6b7280;">1 Ay</div>
                    </div>
                    <div style="background:#f5f3ff;border-radius:10px;padding:12px;cursor:pointer;border:2px solid #8b5cf6;" onclick="selectTestPlan(this,'premium6',6,75)">
                        <div style="font-weight:700;color:#8b5cf6;">75 ₼</div>
                        <div style="font-size:12px;color:#6b7280;">6 Ay</div>
                        <div style="font-size:10px;color:#10b981;">-17%</div>
                    </div>
                    <div style="background:#fffbeb;border-radius:10px;padding:12px;cursor:pointer;border:2px solid transparent;" onclick="selectTestPlan(this,'premium12',12,120)">
                        <div style="font-weight:700;color:#f59e0b;">120 ₼</div>
                        <div style="font-size:12px;color:#6b7280;">1 İl</div>
                        <div style="font-size:10px;color:#10b981;">-33%</div>
                    </div>
                </div>
            `}
            
            <div style="display:flex;gap:12px;">
                <button onclick="document.getElementById('premiumPromptOverlay').remove()"
                    style="flex:1;padding:12px;border:2px solid #e5e7eb;background:white;border-radius:10px;font-weight:600;cursor:pointer;color:#6b7280;">
                    Bağla
                </button>
                ${hasPending ? `
                    <button onclick="document.getElementById('premiumPromptOverlay').remove()"
                        style="flex:2;padding:12px;background:#f59e0b;color:white;border-radius:10px;font-weight:600;cursor:pointer;border:none;">
                        <i class="fas fa-clock"></i> Gözlənilir...
                    </button>
                ` : `
                    <button id="testPromptBtn" onclick="submitTestPremiumRequest()"
                        style="flex:2;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:10px;font-weight:600;cursor:pointer;border:none;">
                        <i class="fas fa-paper-plane"></i> Müraciət Et
                    </button>
                `}
            </div>
        </div>
    `;
    
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    window._selectedTestPlan = { planId: 'premium6', months: 6, price: 75 };
}

function selectTestPlan(el, planId, months, price) {
    document.querySelectorAll('#premiumPromptOverlay [onclick^="selectTestPlan"]').forEach(e => e.style.border = '2px solid transparent');
    el.style.border = '2px solid #667eea';
    window._selectedTestPlan = { planId, months, price };
}

function submitTestPremiumRequest() {
    const plan = window._selectedTestPlan;
    if (!plan) return;
    
    const user = getCurrentUser();
    if (!user) { window.location.href = 'login.html'; return; }
    
    const btn = document.getElementById('testPromptBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }
    
    const allUsers = Storage.get('allUsers') || [];
    const idx = allUsers.findIndex(u => u.id === user.id);
    if (idx !== -1) {
        allUsers[idx].premiumRequestedAt = new Date().toISOString();
        allUsers[idx].requestedPlan = plan;
        Storage.set('allUsers', allUsers);
        user.premiumRequestedAt = allUsers[idx].premiumRequestedAt;
        Storage.set('currentUser', user);
    }
    
    const requests = Storage.get('premiumRequests') || [];
    requests.unshift({
        id: Date.now(), userId: user.id, userName: user.name, userEmail: user.email,
        plan: plan.planId, months: plan.months, price: plan.price,
        requestedAt: new Date().toISOString(), status: 'pending',
        date: new Date().toLocaleDateString('az-AZ'), time: new Date().toLocaleTimeString('az-AZ')
    });
    Storage.set('premiumRequests', requests);
    
    setTimeout(() => {
        document.getElementById('premiumPromptOverlay')?.remove();
        alert('✅ Müraciətiniz göndərildi!\nAdmin tərəfindən yoxlanılacaq.');
    }, 600);
}

function showQuestion() {
    const q = currentTest.data[currentQ];
    const modal = document.createElement('div');
    modal.id = 'quizModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = `
        <div style="background:white;border-radius:15px;padding:30px;max-width:600px;width:90%;">
            <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                <span style="color:var(--gray);">Sual ${currentQ + 1}/${currentTest.questions}</span>
                <button onclick="closeQuiz()" style="background:none;border:none;font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <h3 style="font-size:20px;margin-bottom:25px;">${q.q}</h3>
            <div id="options">${q.opts.map((opt, i) => `
                <button onclick="selectAnswer(${i})" style="display:block;width:100%;padding:15px;margin-bottom:10px;border:2px solid var(--border);border-radius:10px;background:white;text-align:left;cursor:pointer;font-size:15px;">
                    ${opt}
                </button>
            `).join('')}</div>
            <div id="feedback" style="margin-top:20px;font-weight:600;"></div>
            <button id="nextBtn" onclick="nextQuestion()" style="display:none;margin-top:15px;" class="btn btn-primary">Növbəti</button>
        </div>
    `;
    document.body.appendChild(modal);
}

function selectAnswer(idx) {
    const q = currentTest.data[currentQ];
    const btns = document.querySelectorAll('#options button');
    btns.forEach(b => b.disabled = true);
    
    if (idx === q.ans) {
        btns[idx].style.background = '#ecfdf5';
        btns[idx].style.borderColor = '#10b981';
        document.getElementById('feedback').innerHTML = '<span style="color:#10b981;">✓ Düzgün!</span>';
        score++;
    } else {
        btns[idx].style.background = '#fef2f2';
        btns[idx].style.borderColor = '#ef4444';
        btns[q.ans].style.background = '#ecfdf5';
        btns[q.ans].style.borderColor = '#10b981';
        document.getElementById('feedback').innerHTML = '<span style="color:#ef4444;">✗ Səhv</span>';
    }
    
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    currentQ++;
    closeQuiz();
    if (currentQ < currentTest.questions) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    const pct = Math.round((score / currentTest.questions) * 100);
    // 100-ballıq sistem: neçə sualdan neçəsi düzgün → ball
    const ballScore = pct; // 100-ballıq (faiz ilə eyni: 10/10=100, 8/10=80 ...)
    const user = getCurrentUser();

    // Award xal (points) — duplicate-safe
    let earnedPoints = 0;
    const pointsData = typeof getUserPoints === 'function' ? getUserPoints(user.id) : null;
    const alreadyEarned = pointsData && (pointsData.completedTests || []).includes(String(currentTest.id));
    if (typeof awardTestPoints === 'function') {
        earnedPoints = awardTestPoints(currentTest.title, score, currentTest.questions, currentTest.id);
    }

    // ── 100-ballıq nəticəni profildə saxla ─────────────────────────────────
    saveTestScore(user, currentTest, score, ballScore);

    // Save full test result record
    saveTestResult({
        testId:       currentTest.id,
        testTitle:    currentTest.title,
        userId:       user.id,
        userName:     user.name,
        userEmail:    user.email,
        score:        score,
        total:        currentTest.questions,
        percentage:   pct,
        ballScore:    ballScore,
        earnedPoints: earnedPoints,
        date:         new Date().toISOString(),
        timestamp:    Date.now()
    });

    // Update attempt / unique-user stats
    updateTestStats(currentTest.id);

    // Grade label (100-ballıq)
    const grade = ballScore === 100 ? '🏆 Mükəmməl'
                : ballScore >= 80  ? '🌟 Əla'
                : ballScore >= 60  ? '👍 Yaxşı'
                : ballScore >= 40  ? '📖 Qənaətbəxş'
                : '📚 Zəif';
    const gradeColor = ballScore >= 60 ? '#10b981' : ballScore >= 40 ? '#f59e0b' : '#ef4444';
    const wrong = currentTest.questions - score;

    const modal = document.createElement('div');
    modal.id = 'resultModal';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
    modal.innerHTML = `
        <div style="background:white;border-radius:20px;padding:32px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:92vh;overflow-y:auto;">

            <!-- 100-ballıq böyük göstərici -->
            <div style="background:linear-gradient(135deg,#0f0c29,#302b63);border-radius:16px;padding:22px 20px;margin-bottom:20px;position:relative;overflow:hidden;">
                <div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);"></div>
                <div style="font-size:13px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Sınaq Balı</div>
                <div style="font-size:72px;font-weight:900;color:white;line-height:1;">${ballScore}</div>
                <div style="font-size:14px;color:rgba(255,255,255,.6);margin-top:2px;">100 bal üzərindən</div>
                <div style="margin-top:10px;display:inline-block;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 16px;font-size:13px;font-weight:700;color:white;">${grade}</div>
            </div>

            <h3 style="font-size:16px;font-weight:700;color:#1f2937;margin-bottom:4px;">${currentTest.title}</h3>
            <p style="color:#9ca3af;font-size:13px;margin-bottom:18px;">${currentTest.questions} sual · ${currentTest.time || currentTest.duration || '?'} dəq</p>

            <!-- Stats üçlüyü -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;">
                <div style="background:#ecfdf5;border-radius:12px;padding:14px 8px;">
                    <div style="font-size:24px;font-weight:800;color:#10b981;">${score}</div>
                    <div style="font-size:11px;color:#6b7280;">Düzgün</div>
                </div>
                <div style="background:#fef2f2;border-radius:12px;padding:14px 8px;">
                    <div style="font-size:24px;font-weight:800;color:#ef4444;">${wrong}</div>
                    <div style="font-size:11px;color:#6b7280;">Səhv</div>
                </div>
                <div style="background:#eef2ff;border-radius:12px;padding:14px 8px;">
                    <div style="font-size:24px;font-weight:800;color:#667eea;">${pct}%</div>
                    <div style="font-size:11px;color:#6b7280;">Faiz</div>
                </div>
            </div>

            <!-- Qazanılan xal -->
            ${earnedPoints > 0 ? `
                <div style="background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:12px;padding:11px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <span style="font-size:20px;">🎉</span>
                    <span style="color:white;font-weight:700;font-size:16px;">+${earnedPoints} xal qazandınız!</span>
                </div>
            ` : alreadyEarned ? `
                <div style="background:#f3f4f6;border-radius:12px;padding:10px 16px;margin-bottom:18px;">
                    <div style="color:#6b7280;font-size:13px;"><i class="fas fa-info-circle"></i> Bu sınaqdan artıq xal qazanmısınız</div>
                </div>
            ` : ''}

            <!-- Uğurlar düyməsi -->
            <div style="display:flex;gap:10px;">
                <button onclick="closeResult()" class="btn btn-secondary" style="flex:1;padding:13px;font-size:14px;">
                    Bağla
                </button>
                <a href="success.html" class="btn btn-primary" style="flex:1;padding:13px;font-size:14px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;">
                    <i class="fas fa-trophy"></i> Uğurlar
                </a>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

// ── 100-ballıq nəticəni userPoints.testScores və allUsers-da saxla ────────────
function saveTestScore(user, test, rawScore, ballScore) {
    if (!user || !test) return;

    // 1. userPoints.testScores — yalnız ən yüksək balı saxla
    if (typeof getUserPoints === 'function' && typeof saveUserPoints === 'function') {
        const data = getUserPoints(user.id);
        if (!data.testScores) data.testScores = {};
        const key = String(test.id);
        const prev = data.testScores[key];
        // Həmişə saxla; əgər daha yüksəkdirsə üzərinə yaz
        if (!prev || ballScore > prev.ballScore) {
            data.testScores[key] = {
                testId:    key,
                testTitle: test.title,
                ballScore: ballScore,
                rawScore:  rawScore,
                total:     test.questions,
                date:      new Date().toISOString().slice(0, 10),
                timestamp: Date.now()
            };
            // saveUserPoints həm localStorage-a həm Upstash-a yazır + points:updated atır
            saveUserPoints(user.id, data);
        }
    }

    // 2. allUsers — testScores array (ən son 30 nəticə, best-per-test)
    const allUsers = Storage.get('allUsers') || [];
    const ui = allUsers.findIndex(u => String(u.id) === String(user.id));
    if (ui !== -1) {
        if (!Array.isArray(allUsers[ui].testScores)) allUsers[ui].testScores = [];
        const existing = allUsers[ui].testScores.findIndex(s => String(s.testId) === String(test.id));
        const entry = {
            testId:    String(test.id),
            testTitle: test.title,
            ballScore: ballScore,
            rawScore:  rawScore,
            total:     test.questions,
            date:      new Date().toISOString().slice(0, 10),
            timestamp: Date.now()
        };
        if (existing !== -1) {
            // Yalnız ən yüksəyi saxla
            if (ballScore >= allUsers[ui].testScores[existing].ballScore) {
                allUsers[ui].testScores[existing] = entry;
            }
        } else {
            allUsers[ui].testScores.unshift(entry);
            if (allUsers[ui].testScores.length > 30) allUsers[ui].testScores.length = 30;
        }
        allUsers[ui].lastTestScore  = ballScore;
        allUsers[ui].lastTestTitle  = test.title;
        allUsers[ui].lastTestDate   = new Date().toISOString().slice(0, 10);
        Storage.set('allUsers', allUsers);
    }

    // 3. currentUser-u da yenilə ki, dashboard dərhal görsün
    const cu = Storage.get('currentUser');
    if (cu && String(cu.id) === String(user.id)) {
        if (!Array.isArray(cu.testScores)) cu.testScores = [];
        const ex = cu.testScores.findIndex(s => String(s.testId) === String(test.id));
        const entry = {
            testId: String(test.id), testTitle: test.title,
            ballScore, rawScore, total: test.questions,
            date: new Date().toISOString().slice(0,10), timestamp: Date.now()
        };
        if (ex !== -1) {
            if (ballScore >= cu.testScores[ex].ballScore) cu.testScores[ex] = entry;
        } else {
            cu.testScores.unshift(entry);
            if (cu.testScores.length > 30) cu.testScores.length = 30;
        }
        cu.lastTestScore = ballScore;
        cu.lastTestTitle = test.title;
        cu.lastTestDate  = new Date().toISOString().slice(0,10);
        Storage.set('currentUser', cu);
    }
}

function closeQuiz() {
    const modal = document.getElementById('quizModal');
    if (modal) modal.remove();
}

function closeResult() {
    const modal = document.getElementById('resultModal');
    if (modal) modal.remove();
}

// Sınaq nəticəsini saxla
function saveTestResult(result) {
    const results = Storage.get('testResults') || [];
    results.push(result);
    Storage.set('testResults', results);
    console.log('✅ Nəticə saxlanıldı:', result);
}

// Sınaq statistikasını yenilə
function updateTestStats(testId) {
    const stats = Storage.get('testStats') || {};

    if (!stats[testId]) {
        stats[testId] = { testId, totalAttempts: 0, uniqueUsers: [] };
    }

    stats[testId].totalAttempts++;

    // uniqueUsers həmişə array kimi saxla
    if (!Array.isArray(stats[testId].uniqueUsers)) {
        stats[testId].uniqueUsers = [];
    }

    const user = getCurrentUser();
    if (user && user.email && !stats[testId].uniqueUsers.includes(user.email)) {
        stats[testId].uniqueUsers.push(user.email);
    }

    Storage.set('testStats', stats);
    console.log('📊 Statistika yeniləndi:', stats[testId]);
}

renderTests();

// Re-render after Upstash loads fresh data
window.addEventListener('upstash:loaded', renderTests);
</script>
